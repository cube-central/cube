<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ECECEC" id="themeColor">
<title>Upgrade · Cube</title>
<link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/gh/Parallax-Oficial/cube@main/cube-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Misma identidad que cube.html (variables del tema dark) */
:root{--verde:#C6FF00;--fondo:#111313;--panel:#1D2220;--tarjeta:#1D2220;--texto:#F4F5F2;--texto-suave:#858D87;--negro:#0A0A0A;--tinta:#F4F5F2;--acento:#C6FF00;--oscuro:#0C0E0D;--linea:#2A302D;--rojo:#E5484D;--margen:3.4vw;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--fondo)}
body{font-family:'Poppins',sans-serif;color:var(--texto);min-height:100vh;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit}
[hidden]{display:none!important}
@media (min-width:700px){:root{--margen:28px}}

/* ===== Intro: el blanco de cube se oscurece ===== */
#intro{position:fixed;inset:0;z-index:500;display:grid;place-items:center;background:#ECECEC;transition:background-color .9s ease,opacity .5s ease .1s}
#intro .logo{font-weight:800;font-size:clamp(2.4rem,14vw,3.6rem);letter-spacing:-.5px;text-transform:lowercase;color:#0A0A0A;transition:color .9s ease}
#intro.oscuro{background:#111313}
#intro.oscuro .logo{color:var(--verde)}
#intro.fuera{opacity:0;pointer-events:none}
.app{max-width:560px;margin:0 auto;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
.app.listo{opacity:1;transform:none}

/* ===== Cabecera ===== */
.top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 12px) var(--margen) 8px}
.top h1{grid-column:2;text-align:center;font-weight:700;font-size:1.1rem;letter-spacing:.2px;text-transform:lowercase;color:var(--texto)}
.top-ico{grid-column:3;width:44px;height:44px;display:grid;place-items:center;color:var(--tinta);transition:transform .12s,color .2s}
.top-ico svg{width:26px;height:26px}
.top-ico:active{transform:scale(.9)}
.top-ico:hover{color:var(--verde)}
.top-ico:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--verde);outline-offset:2px;border-radius:14px}

/* ===== Dial ===== */
.dial-wrap{position:relative;width:min(80vw,360px);aspect-ratio:1;margin:12px auto 0}
.dial{width:100%;height:100%;display:block;overflow:visible}
.dial .halo{transition:opacity .6s;opacity:0}
.dial-texto{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.pct{font-weight:600;font-size:clamp(2.6rem,13vw,3.5rem);line-height:1;letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
.pct small{font-size:.55em;font-weight:500;color:var(--texto-suave);margin-left:3px;letter-spacing:0}
.mult{margin-top:8px;font-size:.95rem;font-weight:600;color:var(--texto-suave);min-height:1.2em;font-variant-numeric:tabular-nums}
.dial-wrap.gano .pct{color:var(--verde)}
.dial-wrap.gano .halo{opacity:1}
.dial-wrap.perdio .pct{color:var(--rojo)}
#aguja{filter:drop-shadow(0 0 5px rgba(198,255,0,.55))}
.dial-wrap.perdio #aguja{filter:drop-shadow(0 0 6px rgba(229,72,77,.7))}
.dial-wrap.gano #zona{animation:latido .7s ease-in-out 3}
@keyframes latido{50%{stroke-width:15}}

/* dirección */
.dir{display:flex;width:max-content;margin:20px auto 0;padding:4px;background:var(--panel);border-radius:999px}
.dir button{display:flex;align-items:center;gap:6px;height:36px;padding:0 16px;border-radius:999px;font-size:.8rem;font-weight:600;color:var(--texto-suave);transition:background .2s,color .2s}
.dir button svg{width:16px;height:16px}
.dir button[aria-pressed="true"]{background:var(--verde);color:var(--negro)}
.dir button:disabled{cursor:default}

/* ranuras */
.ranuras{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px var(--margen) 0}
.ranura{min-width:0}
.ranura-t{display:block;font-size:.74rem;color:var(--texto-suave);font-weight:500;margin-bottom:8px}
.slot{position:relative;width:100%;aspect-ratio:16/9;border-radius:15px;background:var(--panel);overflow:hidden;display:grid;place-items:center;font-size:.72rem;font-weight:500;color:var(--texto-suave);text-align:center;padding:8px}
.slot.vacia{background:transparent;border:1.5px dashed #3a4440}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .n{position:absolute;right:7px;bottom:7px;background:var(--fondo);color:var(--verde);font-size:.64rem;font-weight:600;padding:3px 8px;border-radius:999px}
.slot-n{display:block;margin-top:8px;font-size:.8rem;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1em}

.acciones{margin:20px var(--margen) 0;display:flex;gap:10px}
.b-pri,.b-sec{flex:1;min-height:52px;border-radius:16px;font-weight:700;font-size:1rem;transition:transform .12s,opacity .2s}
.b-pri{background:var(--verde);color:var(--negro)}
.b-sec{background:var(--panel);color:var(--texto);font-weight:600;font-size:.9rem;flex:0 0 auto;padding:0 18px}
.b-pri:active:not(:disabled),.b-sec:active{transform:scale(.98)}
.b-pri:disabled{opacity:.4;cursor:default}

/* ===== Pestañas plegadas (igual que el inventario de cube.html) ===== */
.fold{--r:clamp(26px,9vw,44px);--th:clamp(48px,13.6vw,64px);--f:calc(var(--r) * .55);position:relative;margin:30px var(--margen) 0}
.fold::before{content:"";position:absolute;top:var(--th);width:var(--r);height:var(--r);background:var(--verde);z-index:0}
.fold[data-tab="inv"]::before{right:0}
.fold[data-tab="cat"]::before{left:0}
.fold-tabs{position:relative;z-index:2;height:var(--th)}
.fold-tab{position:absolute;top:0;height:var(--th);background:var(--verde);color:var(--negro);font-weight:500;font-size:clamp(.95rem,4.1vw,1.2rem)}
.fold-tab[aria-selected="true"]{background:var(--tarjeta);color:var(--texto);border-radius:var(--r) var(--r) 0 0;z-index:2}
.fold-tab[aria-selected="false"]{z-index:1}
#tabInv{left:0;width:50%}
#tabCat{left:50%;right:0}
.fold[data-tab="inv"] #tabCat{left:calc(50% - var(--r));padding-left:var(--r);border-radius:0 var(--r) 0 0}
.fold[data-tab="cat"] #tabInv{width:calc(50% + var(--r));padding-right:var(--r);border-radius:var(--r) 0 0 0}
.fold-tab[aria-selected="true"]::after{content:"";position:absolute;bottom:0;width:var(--f);height:var(--f);background:var(--tarjeta);pointer-events:none}
#tabInv[aria-selected="true"]::after{left:calc(100% - 1px);-webkit-mask:radial-gradient(circle at 100% 0,transparent var(--f),#000 calc(var(--f) + .6px));mask:radial-gradient(circle at 100% 0,transparent var(--f),#000 calc(var(--f) + .6px))}
#tabCat[aria-selected="true"]::after{right:calc(100% - 1px);-webkit-mask:radial-gradient(circle at 0 0,transparent var(--f),#000 calc(var(--f) + .6px));mask:radial-gradient(circle at 0 0,transparent var(--f),#000 calc(var(--f) + .6px))}
.fold-card{position:relative;z-index:1;background:var(--tarjeta);padding:clamp(22px,6.4vw,32px) clamp(14px,4.6vw,22px) clamp(26px,8vw,38px)}
.fold[data-tab="inv"] .fold-card{border-radius:0 var(--r) var(--r) var(--r)}
.fold[data-tab="cat"] .fold-card{border-radius:var(--r) 0 var(--r) var(--r)}

/* filas: idénticas a Mi inventario de cube.html */
.rareza{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.58rem;font-weight:600;line-height:1.4}
.rareza.comun{background:#FFD60A;color:#0A0A0A}
.rareza.raro{background:#E5484D;color:#fff}
.rareza.extraordinario{background:#8B5CF6;color:#fff}
.rareza.legendario{background:#D4A72C;color:#0A0A0A}
.inv-lista{display:flex;flex-direction:column;gap:12px}
.inv-fila{display:flex;align-items:center;gap:10px}
.inv-fila.agotada .inv-cov,.inv-fila.agotada .inv-info{opacity:.45}
.inv-acc{display:flex;flex-direction:row;align-items:center;gap:6px;flex:none}
.inv-btn{width:30px;height:30px;border-radius:50%;background:var(--fondo);display:grid;place-items:center;color:var(--tinta);transition:transform .12s,background .2s}
.inv-btn svg{width:16px;height:16px}
.inv-btn:active{transform:scale(.9)}
.inv-btn.on{background:var(--verde);color:var(--negro)}
.inv-btn:disabled{opacity:.35;cursor:default}
.inv-cov{flex:0 0 31%;aspect-ratio:16/8.5;border-radius:12px;overflow:hidden;background:var(--fondo);cursor:pointer;position:relative}
.inv-cov img{width:100%;height:100%;object-fit:cover;display:block}
.inv-cov .sin-img{display:grid;place-items:center;height:100%;padding:6px;font-size:.62rem;font-weight:600;text-align:center;color:var(--texto-suave)}
.inv-info{flex:1;min-width:0}
.inv-tit{font-weight:500;font-size:.72rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--texto)}
.inv-tags{display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin-top:6px}
.inv-x{display:inline-block;padding:1px 7px;border-radius:999px;background:var(--oscuro);color:var(--verde);font-size:.58rem;font-weight:700;line-height:1.4}
.inv-x.juego{background:var(--verde);color:var(--negro)}
.cw-vacio{padding:18px 0;color:var(--texto-suave);font-size:.85rem;text-align:center}

.buscador{display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;background:var(--fondo);border-radius:999px;color:var(--texto-suave);margin-bottom:18px}
.buscador input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--texto);font-family:inherit;font-size:.9rem}
.buscador input::placeholder{color:var(--texto-suave)}
.buscador input::-webkit-search-cancel-button{display:none}
.buscador svg{flex:none;width:20px;height:20px}

/* hoja de resultado */
.hoja{position:fixed;inset:0;z-index:160;display:grid;place-items:center;padding:20px;background:rgba(10,12,11,.72);animation:aparece .25s ease}
@keyframes aparece{from{opacity:0}to{opacity:1}}
.tarjeta{width:100%;max-width:340px;background:var(--panel);border-radius:24px;padding:16px 16px 18px;animation:sube .3s cubic-bezier(.2,.9,.3,1.1)}
@keyframes sube{from{transform:translateY(24px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.tarjeta .portada-g{aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:var(--fondo)}
.tarjeta .portada-g img{width:100%;height:100%;object-fit:cover;display:block}
.tarjeta h3{font-size:1.25rem;font-weight:700;margin:16px 4px 4px;letter-spacing:-.3px}
.tarjeta p{margin:0 4px;font-size:.85rem;line-height:1.5;color:var(--texto-suave)}
.tarjeta.gana h3{color:var(--verde)}
.tarjeta.pierde h3{color:var(--rojo)}
.tarjeta .b-pri{width:100%;margin-top:18px}
.v-toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:400;max-width:88%;padding:12px 18px;border-radius:14px;background:var(--verde);color:var(--negro);font-size:.82rem;font-weight:600;text-align:center;transition:opacity .25s,transform .25s}
.v-toast.on{opacity:1;transform:translate(-50%,0)}
#confeti{position:fixed;inset:0;width:100%;height:100%;z-index:140;pointer-events:none;transition:opacity .9s ease}
#confeti.fuera{opacity:0}
body.ocupado .fold,body.ocupado .dir{pointer-events:none}
@media (prefers-reduced-motion:reduce){#intro,#intro .logo,.app{transition:none}.hoja,.tarjeta{animation:none}.dial-wrap.gano #zona{animation:none}}
</style>
</head>
<body>
<div id="intro" aria-hidden="true"><div class="logo">cube</div></div>

<div class="app" id="app">
  <header class="top">
    <h1>upgrade</h1>
    <a class="top-ico" href="cube.html" aria-label="Volver a cube">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"/></svg>
    </a>
  </header>

  <div class="dial-wrap" id="dialWrap">
    <svg class="dial" viewBox="0 0 500 500" role="img" aria-label="Probabilidad de obtener la historia">
      <defs>
        <radialGradient id="cara" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#262d2a"/><stop offset="1" stop-color="#171b19"/></radialGradient>
        <radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#c6ff00" stop-opacity=".22"/><stop offset="1" stop-color="#c6ff00" stop-opacity="0"/></radialGradient>
        <linearGradient id="gAguja" gradientUnits="userSpaceOnUse" x1="250" y1="250" x2="250" y2="30"><stop offset="0" stop-color="#F4F5F2" stop-opacity="0"/><stop offset="1" stop-color="#F4F5F2" stop-opacity="1"/></linearGradient>
        <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
      </defs>
      <circle class="halo" cx="250" cy="250" r="250" fill="url(#halo)"/>
      <polygon id="marco" fill="#161a19" stroke="#262d2a" stroke-width="2" stroke-linejoin="round"/>
      <polygon id="riel" fill="none" stroke="#262d2a" stroke-width="12" stroke-linejoin="round"/>
      <polygon id="cara2" fill="url(#cara)" stroke="#111313" stroke-width="2" stroke-linejoin="round"/>
      <g id="marcas" stroke="#F4F5F2" stroke-opacity=".16" stroke-width="2" stroke-linecap="round"></g>
      <path id="zonaGlow" fill="none" stroke="#c6ff00" stroke-opacity=".5" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#blur)"/>
      <path id="zona" fill="none" stroke="#c6ff00" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <g id="aguja"><line id="agLinea" x1="250" y1="130" x2="250" y2="30" stroke="url(#gAguja)" stroke-width="5" stroke-linecap="round"/></g>
    </svg>
    <div class="dial-texto"><div class="pct" id="pct">0.0<small>%</small></div><div class="mult" id="mult"></div></div>
  </div>

  <div class="dir" role="group" aria-label="Dirección del giro">
    <button type="button" id="dirIzq" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H5M11 6l-6 6 6 6"/></svg>Izquierda</button>
    <button type="button" id="dirDer" aria-pressed="true">Derecha<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg></button>
  </div>

  <div class="ranuras">
    <div class="ranura"><span class="ranura-t">Pones</span><div class="slot vacia" id="slotMias">Elige de tu inventario</div><span class="slot-n" id="slotMiasN"></span></div>
    <div class="ranura"><span class="ranura-t">Obtienes</span><div class="slot vacia" id="slotObj">Elige del catálogo</div><span class="slot-n" id="slotObjN"></span></div>
  </div>

  <div class="acciones">
    <button class="b-sec" id="btnVaciar" type="button" hidden>Quitar</button>
    <button class="b-pri" id="btnObtener" type="button" disabled>Obtener</button>
  </div>

  <div class="fold" id="fold" data-tab="inv">
    <div class="fold-tabs" role="tablist">
      <button class="fold-tab" id="tabInv" type="button" role="tab" aria-selected="true">Mi inventario</button>
      <button class="fold-tab" id="tabCat" type="button" role="tab" aria-selected="false" tabindex="-1">Catálogo</button>
    </div>
    <div class="fold-card">
      <div id="paneInv"><div class="inv-lista" id="listaInv"></div></div>
      <div id="paneCat" hidden>
        <label class="buscador">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="buscar" type="search" placeholder="Buscar historia" autocomplete="off" enterkeyhint="search" aria-label="Buscar historia">
        </label>
        <div class="inv-lista" id="listaCat"></div>
      </div>
    </div>
  </div>
</div>

<div class="v-toast" id="toast" role="status"></div>
<canvas id="confeti" hidden></canvas>
<div class="hoja" id="hojaRes" hidden><div class="tarjeta" id="tarjetaRes" role="dialog" aria-modal="true" aria-live="assertive"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="cube-config.js"></script>
<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const IMG_BASE = 'https://cdn.jsdelivr.net/gh/Parallax-Oficial/cube@main/';
  const MAX_JUEGO = 60, MAX_COPIAS = 3, PROB_MAX = 0.95;
  // NECESITA[rareza que quieres][rareza que pones] = cuántas historias de esa rareza hacen falta, como mínimo, para llegar al tope (PROB_MAX).
  // Cada historia aporta PROB_MAX / ese número; se pueden mezclar rarezas y los aportes se suman.
  const NECESITA = {
    comun:          { comun: 10, raro: 6,  extraordinario: 3,  legendario: 1 },
    raro:           { comun: 20, raro: 10, extraordinario: 6,  legendario: 2 },
    extraordinario: { comun: 35, raro: 20, extraordinario: 10, legendario: 3 },
    legendario:     { comun: 59, raro: 39, extraordinario: 19, legendario: 4 }
  };
  const ZONA_INICIO = 12, OMEGA = 600;
  const NOM = { comun: 'Común', raro: 'Raro', extraordinario: 'Extraordinario', legendario: 'Legendario' };
  const ORD = { comun: 0, raro: 1, extraordinario: 2, legendario: 3 };
  const FIJAS = { 'bigfoot.webp':'raro','bigfoot-2.webp':'raro','ratman.webp':'raro','las-entrevistas.webp':'legendario','divina-comedia.webp':'legendario','triangle-room.webp':'legendario','eternamente-vivo.webp':'extraordinario','eternamente-vivo-2.webp':'legendario' };

  const CATALOGO = [
    ['muevete-al-minuto','Muévete al Minuto'],['metalosis-maligna','Metalosis Maligna'],['retorcidos','Retorcidos'],
    ['nada','Nada'],['strike','Strike'],['gorgeous-vortex','Gorgeous Vortex'],['obedece','Obedece'],['ultimate','Ultimate'],
    ['valentine','Valentine'],['mama-dogs','Mama Dogs'],['el-telefono','El Teléfono'],['bigfoot-2','Bigfoot'],['ratman','Ratman'],
    ['without-warning','Without Warning'],['golem','Golem'],['eternamente-vivo','Eternamente Vivo con Amadeus Shell'],
    ['eternamente-vivo-dante','Eternamente Vivo con Dante el Grande'],['eternamente-vivo-valak','Eternamente Vivo con Valak Seraphel'],
    ['fenomeno-vulgar','Fenómeno Vulgar'],['las-entrevistas','Las Entrevistas'],['la-familia-rani','La Familia Rani'],
    ['menem','Menem'],['divina-comedia','Divina Comedia'],['triangle-room','Triangle Room']
  ].map(([i, alt]) => ({ img: i + '.webp', alt }));
  const PRECIOS = {
    'bigfoot-2.webp':250,'muevete-al-minuto.webp':90,'metalosis-maligna.webp':100,'nada.webp':90,'strike.webp':100,
    'gorgeous-vortex.webp':100,'ultimate.webp':90,'valentine.webp':90,'obedece.webp':50,'retorcidos.webp':150,'ratman.webp':350,
    'eternamente-vivo.webp':250,'eternamente-vivo-dante.webp':250,'eternamente-vivo-valak.webp':250,'triangle-room.webp':500,
    'menem.webp':250,'mama-dogs.webp':100,'las-entrevistas.webp':500,'golem.webp':100,'la-familia-rani.webp':300,'el-telefono.webp':150
  };
  const precio = i => PRECIOS[i] != null ? PRECIOS[i] : 100;
  const titulo = i => { const p = CATALOGO.find(x => x.img === i); return p ? p.alt : i.replace(/\.[a-z0-9]+$/i, '').replace(/[-_]+/g, ' '); };
  const rareza = i => FIJAS[i] || (precio(i) <= 100 ? 'comun' : precio(i) <= 250 ? 'raro' : precio(i) <= 450 ? 'extraordinario' : 'legendario');
  const aporte = (usada, meta) => PROB_MAX / NECESITA[rareza(meta)][rareza(usada)];
  const ordenar = l => l.slice().sort((a, b) => (ORD[rareza(a)] - ORD[rareza(b)]) || titulo(a).localeCompare(titulo(b), 'es', { sensitivity: 'base' }));
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
  const norm = t => t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  const pct = p => (p * 100).toFixed(1);
  const img = (f, alt) => `<img src="${IMG_BASE}${esc(f)}" alt="${esc(alt)}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'sin-img',textContent:this.alt}))">`;
  const ICO_MAS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
  const ICO_MENOS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 12h12"/></svg>';
  const ICO_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
  function aviso(t) { const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(aviso.t); aviso.t = setTimeout(() => e.classList.remove('on'), 2600); }

  /* ---------- Inventario ----------
     Con sesión de cube: lee la tabla "inventario" y llama a la función profit_historia (el servidor decide y guarda,
     así lo ganado aparece en el inventario de cube.html). Sin sesión: modo de prueba con localStorage. */
  const DEMO_KEY = 'cube_obtener_demo_v1';
  const SEMILLA = { 'muevete-al-minuto.webp':2,'obedece.webp':3,'nada.webp':1,'strike.webp':1,'ultimate.webp':2,'valentine.webp':1,'retorcidos.webp':1,'mama-dogs.webp':1 };
  let db = null, real = false, inv = {};
  try { if (window.supabase && window.CUBE_SUPABASE_URL) db = window.supabase.createClient(window.CUBE_SUPABASE_URL, window.CUBE_SUPABASE_ANON_KEY); } catch (e) { db = null; }
  const cant = i => inv[i] || 0;
  function leerDemo() { try { inv = JSON.parse(localStorage.getItem(DEMO_KEY)); } catch (e) { inv = null; } if (!inv || typeof inv !== 'object') inv = Object.assign({}, SEMILLA); }
  const guardarDemo = () => { try { localStorage.setItem(DEMO_KEY, JSON.stringify(inv)); } catch (e) {} };
  async function cargar() {
    if (db) {
      try {
        const { data: s } = await db.auth.getSession();
        if (s && s.session) {
          const [a, p] = await Promise.all([db.from('inventario').select('historia'), db.from('historias_vendibles').select('archivo,precio')]);
          if (a.error) throw a.error;
          real = true; inv = {};
          (a.data || []).forEach(r => { inv[r.historia] = (inv[r.historia] || 0) + 1; });
          (p.data || []).forEach(r => { PRECIOS[r.archivo] = r.precio; });
          return;
        }
      } catch (e) { console.warn('Inventario real no disponible', e); }
    }
    real = false; leerDemo();
  }

  /* ---------- Estado ---------- */
  let obj = null, sel = {}, ocupado = false, dir = 1, aguja = 0, probMostrada = 0, animProb = 0;
  const enJuego = () => Object.values(sel).reduce((a, b) => a + b, 0);
  const prob = () => obj ? Math.min(PROB_MAX, Object.keys(sel).reduce((a, i) => a + aporte(i, obj) * sel[i], 0)) : 0;
  const puede = () => !ocupado && obj && enJuego() > 0;

  /* ---------- Geometría del octágono (viewBox 500, centro 250,250) ---------- */
  const C = 250, H = 240, S = 385, INSET = 16, H2 = H - INSET, S2 = S - INSET * Math.SQRT2;
  const rad = d => d * Math.PI / 180;
  const oct = (h, s) => { const d = s - h; return [[-d,-h],[d,-h],[h,-d],[h,d],[d,h],[-d,h],[-h,d],[-h,-d]].map(([x, y]) => (C + x).toFixed(1) + ',' + (C + y).toFixed(1)).join(' '); };
  function punto(deg, h, s) {                      // intersección del rayo (0° arriba, horario) con el octágono
    const ux = Math.sin(rad(deg)), uy = -Math.cos(rad(deg));
    const ax = Math.abs(ux), ay = Math.abs(uy);
    const t = Math.min(ax > 1e-9 ? h / ax : Infinity, ay > 1e-9 ? h / ay : Infinity, s / (ax + ay));
    return [C + ux * t, C + uy * t];
  }
  const esquinas = (() => {
    const d = S2 - H2, v = [[d,-H2],[H2,-d],[H2,d],[d,H2],[-d,H2],[-H2,d],[-H2,-d],[-d,-H2]];
    return v.map(([x, y]) => (Math.atan2(x, -y) * 180 / Math.PI + 360) % 360);
  })();
  function rutaZona(largo) {
    if (largo <= 0.4) return '';
    const fin = ZONA_INICIO + largo, a = [ZONA_INICIO];
    for (let e = Math.ceil(ZONA_INICIO); e < fin; e++) a.push(e);
    esquinas.forEach(q => { for (const t of [q, q + 360]) if (t > ZONA_INICIO && t < fin) a.push(t); });
    a.push(fin); a.sort((x, y) => x - y);
    return 'M' + a.map(g => punto(dir * g, H2, S2).map(n => n.toFixed(1)).join(' ')).join(' L');
  }

  // dibujo estático del dial
  $('marco').setAttribute('points', oct(H, S));
  $('riel').setAttribute('points', oct(H2, S2));
  $('cara2').setAttribute('points', oct(H - 38, S - 38 * Math.SQRT2));
  (function () {
    let m = '';
    for (let g = 0; g < 360; g += 6) {
      const r1 = g % 30 === 0 ? 150 : 158, r2 = 168;
      const x1 = C + Math.sin(rad(g)) * r1, y1 = C - Math.cos(rad(g)) * r1, x2 = C + Math.sin(rad(g)) * r2, y2 = C - Math.cos(rad(g)) * r2;
      m += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;
    }
    $('marcas').innerHTML = m;
  })();

  function pintarAguja(a) {                        // la punta llega siempre hasta el riel del octágono
    const u = [Math.sin(rad(a)), -Math.cos(rad(a))];
    const base = [C + u[0] * 122, C + u[1] * 122];
    const punta = punto(a, H2 - 12, S2 - 12 * Math.SQRT2);
    const l = $('agLinea'), g = $('gAguja');
    l.setAttribute('x1', base[0]); l.setAttribute('y1', base[1]); l.setAttribute('x2', punta[0]); l.setAttribute('y2', punta[1]);
    g.setAttribute('x1', base[0]); g.setAttribute('y1', base[1]); g.setAttribute('x2', punta[0]); g.setAttribute('y2', punta[1]);
  }
  function pintarProb(p) {
    const d = rutaZona(p * 360);
    $('zona').setAttribute('d', d); $('zonaGlow').setAttribute('d', d);
    $('pct').innerHTML = pct(p) + '<small>%</small>';
  }
  function animarProb(hasta) {
    cancelAnimationFrame(animProb);
    const desde = probMostrada, t0 = performance.now(), dur = 320;
    (function paso(t) {
      const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      probMostrada = desde + (hasta - desde) * e;
      pintarProb(probMostrada);
      if (k < 1) animProb = requestAnimationFrame(paso);
    })(t0);
  }


  /* ---------- Interfaz ---------- */
  function renderSlots() {
    const llaves = Object.keys(sel).filter(k => sel[k] > 0), n = enJuego(), m = $('slotMias'), o = $('slotObj');
    if (n) { const k = llaves[llaves.length - 1]; m.className = 'slot'; m.innerHTML = img(k, titulo(k)) + `<span class="n">${n} en juego</span>`; $('slotMiasN').textContent = n === 1 ? titulo(llaves[0]) : `${n} historias`; }
    else { m.className = 'slot vacia'; m.textContent = 'Elige de tu inventario'; $('slotMiasN').textContent = ''; }
    if (obj) { o.className = 'slot'; o.innerHTML = img(obj, titulo(obj)); $('slotObjN').textContent = titulo(obj); }
    else { o.className = 'slot vacia'; o.textContent = 'Elige del catálogo'; $('slotObjN').textContent = ''; }
    $('btnVaciar').hidden = !n || ocupado;
  }
  function renderInv() {
    const l = ordenar(Object.keys(inv).filter(k => inv[k] > 0 && k !== obj));
    $('listaInv').innerHTML = l.length ? l.map(k => {
      const n = sel[k] || 0, tot = Math.min(inv[k], MAX_COPIAS), libre = inv[k] - n > 0 && enJuego() < MAX_JUEGO, r = rareza(k);
      return `<div class="inv-fila${n ? '' : ''}" data-id="${esc(k)}">
        <div class="inv-cov" data-k="mas">${img(k, titulo(k))}</div>
        <div class="inv-info"><p class="inv-tit">${esc(titulo(k))}</p><div class="inv-tags"><span class="rareza ${r}">${NOM[r]}</span><span class="inv-x">x${tot}</span>${obj ? `<span class="inv-x">+${(aporte(k, obj) * 100).toFixed(1)}%</span>` : ''}${n ? `<span class="inv-x juego">${n} en juego</span>` : ''}</div></div>
        <div class="inv-acc">
          ${n ? `<button class="inv-btn" type="button" data-k="menos" aria-label="Quitar una copia de ${esc(titulo(k))}">${ICO_MENOS}</button>` : ''}
          <button class="inv-btn${n ? ' on' : ''}" type="button" data-k="mas" aria-label="Sumar ${esc(titulo(k))}"${libre ? '' : ' disabled'}>${ICO_MAS}</button>
        </div></div>`;
    }).join('') : `<p class="cw-vacio">${obj && Object.keys(inv).some(k => inv[k] > 0) ? 'No tienes otras historias para usar.' : 'Aún no tienes historias en tu inventario.'}</p>`;
  }
  function renderCat() {
    const q = norm($('buscar').value);
    let base = CATALOGO.map(p => p.img);
    const lista = ordenar(base).filter(k => !q || norm(titulo(k)).includes(q));
    $('listaCat').innerHTML = lista.length ? lista.map(k => {
      const t = cant(k), lleno = t >= MAX_COPIAS, es = obj === k, r = rareza(k);
      return `<div class="inv-fila${lleno && !es ? ' agotada' : ''}" data-id="${esc(k)}">
        <div class="inv-cov" data-k="obj">${img(k, titulo(k))}</div>
        <div class="inv-info"><p class="inv-tit">${esc(titulo(k))}</p><div class="inv-tags"><span class="rareza ${r}">${NOM[r]}</span>${t ? `<span class="inv-x">Tienes x${t}</span>` : ''}</div></div>
        <div class="inv-acc"><button class="inv-btn${es ? ' on' : ''}" type="button" data-k="obj" aria-pressed="${es}" aria-label="Elegir ${esc(titulo(k))}"${lleno && !es ? ' disabled' : ''}>${es ? ICO_OK : ICO_MAS}</button></div></div>`;
    }).join('') : '<p class="cw-vacio">Sin resultados.</p>';
  }
  function actualizar(animar = true) {
    renderSlots(); renderInv();
    const p = prob();
    if (animar) animarProb(p); else { probMostrada = p; pintarProb(p); }
    $('mult').textContent = (obj && p > 0) ? 'x' + (1 / p).toFixed(2) : '';
    $('btnObtener').disabled = !puede();
    $('btnObtener').textContent = ocupado ? 'Girando…' : 'Obtener';
    document.body.classList.toggle('ocupado', ocupado);
  }

  /* ---------- Acciones ---------- */
  function sumar(k) {
    if (ocupado) return;
    if (enJuego() >= MAX_JUEGO) return aviso(`Máximo ${MAX_JUEGO} historias por intento`);
    if ((sel[k] || 0) >= inv[k]) return;
    sel[k] = (sel[k] || 0) + 1; actualizar();
  }
  function restar(k) { if (ocupado || !sel[k]) return; sel[k]--; if (!sel[k]) delete sel[k]; actualizar(); }
  function elegirObjetivo(k) {
    if (ocupado) return;
    if (cant(k) >= MAX_COPIAS) return aviso(`Ya tienes ${MAX_COPIAS} copias de esta historia`);
    obj = obj === k ? null : k;
    if (obj && sel[obj]) delete sel[obj];
    actualizar(); renderCat();
    if (obj) { irTab('inv'); $('dialWrap').scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  }
  $('listaInv').addEventListener('click', e => {
    const b = e.target.closest('[data-k]'); if (!b || b.disabled) return;
    const k = b.closest('.inv-fila').dataset.id;
    b.dataset.k === 'menos' ? restar(k) : sumar(k);
  });
  $('listaCat').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b && !b.disabled) elegirObjetivo(b.closest('.inv-fila').dataset.id); });
  $('slotMias').onclick = () => irTab('inv', true);
  $('slotObj').onclick = () => irTab('cat', true);
  $('btnVaciar').onclick = () => { if (!ocupado) { sel = {}; actualizar(); } };
  $('buscar').addEventListener('input', renderCat);
  $('buscar').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });

  const fold = $('fold');
  function irTab(n, subir) {
    fold.dataset.tab = n;
    [['inv', $('tabInv'), $('paneInv')], ['cat', $('tabCat'), $('paneCat')]].forEach(([k, t, p]) => { const on = k === n; t.setAttribute('aria-selected', on); t.tabIndex = on ? 0 : -1; p.hidden = !on; });
    if (subir) fold.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  $('tabInv').onclick = () => irTab('inv'); $('tabCat').onclick = () => irTab('cat');

  function fijarDir(d) {
    if (ocupado) return;
    dir = d; $('dirDer').setAttribute('aria-pressed', d > 0); $('dirIzq').setAttribute('aria-pressed', d < 0);
    pintarProb(probMostrada);   // la zona verde se refleja hacia el lado elegido
  }
  $('dirDer').onclick = () => fijarDir(1); $('dirIzq').onclick = () => fijarDir(-1);

  /* ---------- Giro: la dirección elegida; frena donde ya se decidió el resultado ---------- */
  const mod = d => ((d % 360) + 360) % 360, espera = ms => new Promise(r => setTimeout(r, ms));
  function girarLibre() {
    let ult = performance.now(), vivo = true, raf = 0;
    const paso = t => { if (!vivo) return; aguja += dir * OMEGA * (t - ult) / 1000; ult = t; pintarAguja(aguja); raf = requestAnimationFrame(paso); };
    raf = requestAnimationFrame(paso);
    return { parar() { vivo = false; cancelAnimationFrame(raf); } };
  }
  function frenarEn(destino) {
    return new Promise(res => {
      const a = aguja, D0 = OMEGA * 3.6 / 3;
      const extra = dir > 0 ? mod(destino - a - D0) : mod(a - destino - D0);
      const D = D0 + extra, T = 3 * D / OMEGA, t0 = performance.now();
      (function paso(t) {
        const k = Math.min(1, (t - t0) / (T * 1000));
        aguja = a + dir * D * (1 - Math.pow(1 - k, 3)); pintarAguja(aguja);
        if (k < 1) requestAnimationFrame(paso); else { aguja = mod(aguja); pintarAguja(aguja); res(); }
      })(t0);
    });
  }
  function angulo(exito, grados) {                 // punto al azar dentro (o fuera) de la zona, sin pegarse a los bordes
    const ini = exito ? ZONA_INICIO : ZONA_INICIO + grados, largo = exito ? grados : 360 - grados, m = Math.min(3, largo * .25);
    return mod(ini + m + Math.random() * Math.max(0, largo - 2 * m));
  }
  function msgError(e) {
    const m = String((e && e.message) || e || '');
    if (m.includes('limite_copias')) return 'Ya tienes 3 copias de esa historia.';
    if (m.includes('no_las_tienes')) return 'Alguna historia elegida ya no está en tu inventario.';
    if (m.includes('no_autenticado')) return 'Inicia sesión en cube para continuar.';
    return 'No se pudo completar el intento' + (m ? ': ' + m.slice(0, 140) : '. Intenta de nuevo.');
  }

  async function girar() {
    if (!puede()) return;
    const meta = obj, lista = []; Object.keys(sel).forEach(k => { for (let i = 0; i < sel[k]; i++) lista.push(k); });
    let p = prob();
    ocupado = true; $('dialWrap').classList.remove('gano', 'perdio'); actualizar(false);
    const giro = girarLibre();
    try {
      let gana;
      if (real) {
        const [{ data, error }] = await Promise.all([db.rpc('profit_historia', { p_objetivo: meta, p_usadas: lista }), espera(900)]);
        if (error) throw error;
        const r = Array.isArray(data) ? data[0] : data;
        gana = !!(r && r.exito);
        if (r && r.probabilidad != null) p = Math.min(PROB_MAX, Number(r.probabilidad));
      } else {
        await espera(900);
        gana = Math.random() < p;
        if (gana) inv[meta] = cant(meta) + 1;   // ganar: la historia nueva entra y las que pusiste NO se pierden
        else lista.forEach(k => { inv[k]--; if (inv[k] <= 0) delete inv[k]; });   // perder: se pierden las puestas en juego
        guardarDemo();
      }
      probMostrada = p; pintarProb(p);
      giro.parar();
      await frenarEn(mod(dir * angulo(gana, p * 360)));
      await espera(500);
      if (real) await cargar();
      sel = {};
      if (gana) obj = null;
      $('dialWrap').classList.add(gana ? 'gano' : 'perdio');
      if (gana) confeti();
      mostrarRes(meta, gana);
      renderCat(); actualizar(false);
      if (navigator.vibrate) navigator.vibrate(gana ? [60, 40, 60] : 120);
    } catch (e) {
      console.error('Upgrade fallido', e, real ? '(llamada a profit_historia)' : '(modo de prueba)');
      giro.parar(); aviso(msgError(e));
      if (real) { await cargar(); Object.keys(sel).forEach(k => { if (cant(k) < sel[k]) cant(k) ? sel[k] = cant(k) : delete sel[k]; }); }
      ocupado = false; aguja = mod(aguja); actualizar(false); renderCat();
    }
  }
  $('btnObtener').onclick = girar;

  function mostrarRes(meta, gana) {
    const t = $('tarjetaRes'); t.className = 'tarjeta ' + (gana ? 'gana' : 'pierde');
    t.innerHTML = `<div class="portada-g">${img(meta, titulo(meta))}</div><h3>${gana ? '¡Lo conseguiste!' : 'No salió esta vez'}</h3>
      <p>${gana ? `«${esc(titulo(meta))}» ya está en tu inventario.` : 'Las historias que pusiste se perdieron.'}</p>
      <button class="b-pri" id="cerrarRes" type="button">${gana ? 'Continuar' : 'Intentar de nuevo'}</button>`;
    $('hojaRes').hidden = false; $('cerrarRes').focus();
  }
  function cerrarRes() { $('hojaRes').hidden = true; ocupado = false; $('dialWrap').classList.remove('gano', 'perdio'); actualizar(false); }
  $('hojaRes').addEventListener('click', e => { if (e.target.id === 'cerrarRes' || e.target.id === 'hojaRes') cerrarRes(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('hojaRes').hidden) cerrarRes(); });

  /* ---------- Confeti (se desvanece y desaparece) ---------- */
  function confeti() {
    if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
    const cv = $('confeti'), cx = cv.getContext('2d'), dpr = Math.min(2, devicePixelRatio || 1);
    cv.hidden = false; cv.classList.remove('fuera');
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; cx.scale(dpr, dpr);
    const col = ['#c6ff00', '#c6ff00', '#e6ff7a', '#F4F5F2', '#9fcc00', '#5b6a63'];
    const r = dialRect();
    const ps = Array.from({ length: 190 }, (_, i) => {
      const a = -Math.PI / 2 + (Math.random() - .5) * 2.3, v = 7 + Math.random() * 11;
      return { x: r.x, y: r.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, w: 6 + Math.random() * 7, h: 3 + Math.random() * 5,
               rot: Math.random() * 6.28, vr: (Math.random() - .5) * .35, c: col[i % col.length] };
    });
    const t0 = performance.now(), DUR = 3600;
    (function f(t) {
      const el = t - t0;
      cx.clearRect(0, 0, innerWidth, innerHeight);
      ps.forEach(p => {
        p.vy += .22; p.vx *= .992; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillStyle = p.c;
        cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore();
      });
      if (el > DUR - 1000) cv.classList.add('fuera');
      if (el < DUR) requestAnimationFrame(f); else { cx.clearRect(0, 0, innerWidth, innerHeight); cv.hidden = true; }
    })(t0);
  }
  function dialRect() { const b = $('dialWrap').getBoundingClientRect(); return { x: b.left + b.width / 2, y: Math.min(Math.max(b.top + b.height / 2, 200), innerHeight * .6) }; }


  /* ---------- Inicio con animación: el blanco de cube se oscurece y aparece el upgrade ---------- */
  function revelar() {
    const intro = $('intro'), app = $('app');
    const mostrar = () => { app.classList.add('listo'); intro.classList.add('fuera'); setTimeout(() => intro.remove(), 700); $('themeColor').content = '#111313'; };
    if (matchMedia('(prefers-reduced-motion:reduce)').matches) { $('themeColor').content = '#111313'; intro.remove(); app.classList.add('listo'); return; }
    setTimeout(() => intro.classList.add('oscuro'), 650);
    setTimeout(mostrar, 1700);
  }
  pintarAguja(0); fijarDir(1);
  revelar();
  cargar().then(() => { renderCat(); actualizar(false); if (!real) setTimeout(() => aviso('Modo de prueba: inicia sesión en cube para usar tu inventario real'), 1900); });
})();
</script>
</body>
</html>
