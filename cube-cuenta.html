<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080908">
<title>Cube · Cuenta</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
body{min-height:100vh;min-height:100dvh;display:flex;justify-content:center;color:#fff;font-family:'Poppins',sans-serif;background:radial-gradient(90% 50% at 100% 0,rgba(150,200,30,.16),transparent 62%),radial-gradient(120% 60% at 0 100%,rgba(95,140,12,.5),transparent 66%),linear-gradient(165deg,#080908 0%,#0b110a 55%,#142209 100%) fixed}
.w{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 8vh) 7vw calc(env(safe-area-inset-bottom,0px) + 28px)}
.logo{font-weight:800;font-size:2.4rem;letter-spacing:-.5px;line-height:1;color:#C6FF00}
h1{margin-top:6vh;font-weight:400;font-size:1.5rem;text-align:center}
.sub{margin-top:8px;font-size:.84rem;color:#a9b3a0;text-align:center}
.tabs{display:flex;gap:4px;width:100%;margin-top:5vh;padding:4px;border-radius:999px;background:rgba(255,255,255,.07)}
.tabs button{flex:1;height:42px;border-radius:999px;font-weight:600;font-size:.84rem;color:#a9b3a0;transition:background .2s,color .2s}
.tabs button[aria-selected=true]{background:#C6FF00;color:#0A0A0A}
form{width:100%;margin-top:3vh}
.f{margin-top:18px;position:relative}
.f label{font-size:.78rem;color:#a9b3a0}
.f input{display:block;width:100%;margin-top:2px;padding:10px 0;font:500 1.05rem 'Poppins',sans-serif;color:#fff;background:transparent;border:0;border-bottom:1px solid #4d5a46;outline:0;border-radius:0}
.f input:focus{border-bottom-color:#C6FF00}
.f .ojo{position:absolute;right:0;bottom:8px;padding:4px;color:#a9b3a0}
.f .ojo svg{width:20px;height:20px;display:block}
.msg{min-height:20px;margin-top:16px;font-size:.82rem;color:#ff8a7d;text-align:center}
.msg.ok{color:#C6FF00}
.go{width:100%;height:54px;margin-top:6px;border-radius:999px;background:#C6FF00;color:#0A0A0A;font-weight:700;font-size:.86rem;letter-spacing:.1em;text-transform:uppercase;transition:transform .12s,opacity .2s}
.go:active{transform:scale(.97)}.go:disabled{opacity:.45}
.alt{margin-top:22px;font-size:.84rem;color:#a9b3a0}
.alt button{color:#C6FF00;font-weight:600}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="w">
  <div class="logo">cube</div>
  <h1 id="tit">Bienvenido de vuelta</h1>
  <p class="sub" id="sub">Inicia sesión para continuar.</p>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tIn" aria-selected="true">Iniciar sesión</button>
    <button type="button" role="tab" id="tReg" aria-selected="false">Registrarme</button>
  </div>
  <form id="fm" novalidate>
    <div class="f" id="fNom" hidden><label for="nom">Nombre</label><input id="nom" maxlength="30" autocomplete="name"></div>
    <div class="f"><label for="em">Correo</label><input id="em" type="email" inputmode="email" autocomplete="email" autocapitalize="off"></div>
    <div class="f"><label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password" style="padding-right:36px">
      <button type="button" class="ojo" id="ojo" aria-label="Mostrar contraseña"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
    <p class="msg" id="msg" role="alert"></p>
    <button class="go" id="go" type="submit">Entrar</button>
  </form>
  <p class="alt" id="alt">¿No tienes cuenta? <button type="button" id="alt1">Regístrate</button></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="cube-config.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const db = supabase.createClient(window.CUBE_SUPABASE_URL, window.CUBE_SUPABASE_ANON_KEY);
  let reg = false;
  db.auth.getSession().then(r => { if (r.data && r.data.session) location.replace('cube.html'); });

  function modo(r) {
    reg = r; $('tIn').setAttribute('aria-selected', !r); $('tReg').setAttribute('aria-selected', r);
    $('fNom').hidden = !r; $('msg').textContent = ''; $('msg').className = 'msg';
    $('tit').textContent = r ? 'Crea tu cuenta' : 'Bienvenido de vuelta';
    $('sub').textContent = r ? 'Empieza con tu perfil User y personalízalo después.' : 'Inicia sesión para continuar.';
    $('go').textContent = r ? 'Crear cuenta' : 'Entrar';
    $('pw').autocomplete = r ? 'new-password' : 'current-password';
    $('alt').innerHTML = r ? '¿Ya tienes cuenta? <button type="button" id="alt1">Inicia sesión</button>' : '¿No tienes cuenta? <button type="button" id="alt1">Regístrate</button>';
    $('alt1').onclick = () => modo(!reg);
  }
  $('tIn').onclick = () => modo(false); $('tReg').onclick = () => modo(true); $('alt1').onclick = () => modo(true);
  $('ojo').onclick = () => { const p = $('pw'); p.type = p.type === 'password' ? 'text' : 'password'; };

  const err = t => { $('msg').className = 'msg'; $('msg').textContent = t; };
  function traducir(m) {
    m = String(m || '');
    if (/invalid login/i.test(m)) return 'Correo o contraseña incorrectos.';
    if (/already registered|already been/i.test(m)) return 'Ese correo ya tiene una cuenta.';
    if (/password/i.test(m) && /6|short|least/i.test(m)) return 'La contraseña debe tener al menos 6 caracteres.';
    if (/confirm/i.test(m)) return 'Confirma tu correo antes de entrar.';
    if (/rate|too many/i.test(m)) return 'Demasiados intentos. Espera un momento.';
    return 'No se pudo completar. Inténtalo de nuevo.';
  }
  $('fm').addEventListener('submit', async e => {
    e.preventDefault();
    const email = $('em').value.trim(), password = $('pw').value, nombre = $('nom').value.trim();
    if (!/^\S+@\S+\.\S+$/.test(email)) return err('Escribe un correo válido.');
    if (password.length < 6) return err('La contraseña debe tener al menos 6 caracteres.');
    $('go').disabled = true; err('');
    try {
      if (reg) {
        const { data, error } = await db.auth.signUp({ email, password, options: { data: { nombre, name: nombre, full_name: nombre } } });
        if (error) throw error;
        if (data.session) return location.replace('cube.html');
        $('msg').className = 'msg ok'; $('msg').textContent = 'Listo. Revisa tu correo para confirmar tu cuenta.';
      } else {
        const { error } = await db.auth.signInWithPassword({ email, password });
        if (error) throw error;
        location.replace('cube.html');
      }
    } catch (x) { err(traducir(x.message)); }
    $('go').disabled = false;
  });
})();
</script>
</body>
</html>
