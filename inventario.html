<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ECECEC">
<title>cube – Inventario</title>
<script src="cube-tema.js"></script>
<link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/gh/Parallax-Oficial/cube@main/cube-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--verde:#C6FF00;--fondo:#ECECEC;--tarjeta:#fff;--texto:#0A0A0A;--suave:#6B6F68;--negro:#0A0A0A;--tinta:#0A0A0A;--margen:3.4vw;color-scheme:light}
:root[data-tema="dark"]{--fondo:#111313;--tarjeta:#1D2220;--texto:#F4F5F2;--suave:#858D87;--tinta:#F4F5F2;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--fondo)}
body{font-family:'Poppins',sans-serif;color:var(--texto);min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
@media(min-width:700px){:root{--margen:28px}}
:focus-visible{outline:2px solid var(--tinta);outline-offset:2px;border-radius:14px}
.app{max-width:560px;margin:0 auto;padding-bottom:130px}

/* barra superior (como cube.html) */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 12px) var(--margen) 8px}
.perfil-pill{display:flex;align-items:center;gap:8px;min-width:0;max-width:60%;height:46px;padding:5px 16px 5px 5px;background:var(--tarjeta);border-radius:999px;font-weight:700;font-size:.98rem;color:var(--tinta);transition:transform .12s}
.perfil-pill:active{transform:scale(.97)}
.pp-av{flex:none;width:36px;height:36px;border-radius:50%;background:var(--verde);display:grid;place-items:center;overflow:hidden;color:var(--negro)}
.pp-av svg{width:20px;height:20px}.pp-av img{width:100%;height:100%;object-fit:cover}
.pp-nombre{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-ico{position:relative;width:44px;height:44px;display:grid;place-items:center;color:var(--tinta)}
.top-ico svg{width:27px;height:27px}
.cw-badge{position:absolute;top:3px;right:1px;min-width:18px;padding:1px 5px;border-radius:999px;background:var(--verde);color:var(--negro);font-size:.62rem;font-weight:700;line-height:1.4;text-align:center}

/* pestañas: la activa es verde, la otra se funde con la tarjeta blanca */
.fold{--th:clamp(48px,13.6vw,64px);--r:calc(var(--th) / 2);position:relative;margin:14px var(--margen) 0}
.fold::before{content:"";position:absolute;top:var(--th);width:var(--r);height:var(--r);background:var(--verde)}
.fold[data-tab=inv]::before{left:0}.fold[data-tab=col]::before{right:0}
.tabs{position:relative;z-index:2;height:var(--th)}
.tab{position:absolute;top:0;height:var(--th);font-weight:500;font-size:clamp(.95rem,4.1vw,1.2rem);color:var(--negro)}
.tab[aria-selected=true]{width:50%;background:var(--verde);z-index:2}
.tab[aria-selected=false]{background:var(--tarjeta);color:var(--tinta);z-index:1;border-radius:var(--r) var(--r) 0 0}
#tInv{left:0}#tCol{right:0}
#tInv[aria-selected=true]{border-radius:var(--r) var(--r) var(--r) 0}
#tCol[aria-selected=true]{border-radius:var(--r) var(--r) 0 var(--r)}
#tInv[aria-selected=false]{width:calc(50% + var(--r));padding-right:var(--r)}
#tCol[aria-selected=false]{left:calc(50% - var(--r));padding-left:var(--r)}
.card{position:relative;z-index:1;background:var(--tarjeta);padding:clamp(22px,6.2vw,32px) clamp(18px,6vw,30px) clamp(26px,8vw,40px);min-height:240px}
.fold[data-tab=inv] .card{border-radius:var(--r) 0 var(--r) var(--r)}
.fold[data-tab=col] .card{border-radius:0 var(--r) var(--r) var(--r)}

/* inventario: grilla de 3 */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(18px,6vw,28px) clamp(7px,2.4vw,10px)}
.cover{position:relative;aspect-ratio:360/184;border-radius:clamp(14px,4.6vw,20px);overflow:hidden;background:var(--verde);display:grid;place-items:center;color:var(--negro);font-size:1.3rem;width:100%}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.n{margin-top:6px;font-size:clamp(.66rem,2.9vw,.82rem);font-weight:500;line-height:1.25;color:var(--tinta)}
.rz{font-size:clamp(.62rem,2.7vw,.78rem);color:var(--suave);line-height:1.3}
.acts{position:absolute;right:4px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;z-index:2}
.act{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.92);color:#0A0A0A;display:grid;place-items:center;transition:transform .12s}
.act:active{transform:scale(.88)}.act svg{width:15px;height:15px}
.act[aria-pressed=true]{background:#0A0A0A;color:var(--verde)}
.act[aria-pressed=true] svg{fill:currentColor}
.x{position:absolute;left:5px;bottom:5px;padding:0 7px;border-radius:999px;background:#0A0A0A;color:var(--verde);font-size:.62rem;font-weight:700;line-height:1.7}

/* colección: lista de huecos fijos */
.lista{display:flex;flex-direction:column;gap:clamp(9px,3vw,13px)}
.fila{display:grid;grid-template-columns:minmax(0,38%) 1fr;gap:clamp(12px,4vw,18px);align-items:center;width:100%;text-align:left}
.fila .cover{font-size:1rem}
.fila.falta .cover img{filter:grayscale(1) brightness(.5)}
.fila.falta .cover::after{content:"";position:absolute;inset:0;background:rgba(10,10,10,.18)}
.fila .t{font-size:clamp(.82rem,3.5vw,1rem);font-weight:500;line-height:1.25;color:var(--tinta)}
.fila .l{margin-top:2px;font-size:clamp(.72rem,3.1vw,.88rem);color:var(--suave);line-height:1.3}
.pill{display:inline-block;margin-top:7px;padding:2px 12px;border-radius:999px;font-size:clamp(.66rem,2.9vw,.8rem);font-weight:500;line-height:1.5}
.pill.comun{background:#FFD60A;color:#0A0A0A}.pill.raro{background:#E5484D;color:#fff}
.pill.extraordinario{background:#8B5CF6;color:#fff}.pill.legendario{background:#D4A72C;color:#0A0A0A}
.vacio{text-align:center;padding:30px 6px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;height:50px;padding:0 28px;margin-top:16px;border-radius:999px;background:#171917;color:var(--verde);font-weight:700;width:100%}
.btn.b{background:var(--fondo);color:var(--tinta)}
.btn.v{background:var(--verde);color:var(--negro)}
.modal{position:fixed;inset:0;z-index:120;display:grid;place-items:center;padding:20px;background:rgba(10,10,10,.72)}
.hoja{width:min(100%,360px);background:var(--tarjeta);border-radius:30px;padding:14px 14px 18px;text-align:center}
.hoja .cover{border-radius:22px}.hoja h2{margin:12px 6px 0;font-size:1.2rem;line-height:1.2}
.hoja p{margin:4px 6px 0;color:var(--suave);font-size:.85rem}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 110px);transform:translate(-50%,20px);z-index:130;max-width:90vw;padding:11px 18px;background:#0A0A0A;color:#fff;border-radius:20px;font-size:.82rem;text-align:center;opacity:0;pointer-events:none;transition:.3s}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* barra inferior (igual que cube.html) */
.bottom-nav{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(calc(100% - 2 * var(--margen)),540px);display:flex;align-items:flex-end;gap:12px;z-index:100;pointer-events:none}
.bottom-nav>*{pointer-events:auto}
.nav-pill{flex:1;min-width:0;height:clamp(54px,15vw,64px);display:flex;align-items:center;justify-content:space-around;padding:0 6px;background:var(--tarjeta);border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.bottom-nav-item{display:flex;align-items:center;justify-content:center;color:#8D918A;transition:color .2s,transform .15s,background .2s}
.nav-pill .bottom-nav-item{flex:0 0 auto;width:clamp(46px,13.6vw,58px);height:clamp(42px,11.6vw,50px);border-radius:50%}
.nav-pill .bottom-nav-item svg{width:24px;height:24px}
.bottom-nav-item:active{transform:scale(.92)}
.nav-pill .bottom-nav-item.activo{background:var(--fondo);color:var(--tinta)}
#navPerfil{flex:0 0 auto;width:clamp(62px,17.4vw,72px);height:clamp(62px,17.4vw,72px);border-radius:50%;background:var(--verde);color:var(--negro);overflow:hidden}
#navPerfil svg{width:52%;height:52%}#navPerfil img{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="perfil-pill" href="cube.html" aria-label="Perfil"><span class="pp-av" id="ppAv"></span><span class="pp-nombre" id="ppNombre">Iniciar sesión</span></a>
    <a class="top-ico" href="cube.html" aria-label="Notificaciones"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg><b class="cw-badge" id="badge" hidden>0</b></a>
  </header>

  <div class="fold" id="fold" data-tab="inv">
    <div class="tabs" role="tablist">
      <button class="tab" id="tInv" role="tab" aria-selected="true" aria-controls="pInv">Inventario</button>
      <button class="tab" id="tCol" role="tab" aria-selected="false" aria-controls="pCol" tabindex="-1">Colección</button>
    </div>
    <div class="card">
      <section id="pInv" role="tabpanel" aria-labelledby="tInv"><div class="grid" id="grid"></div><div class="vacio" id="vacio" hidden><p>Aún no tienes historias</p><a class="btn" href="lotes.html">Abrir un lote</a></div></section>
      <section id="pCol" role="tabpanel" aria-labelledby="tCol" hidden><div class="lista" id="lista"></div></section>
    </div>
  </div>
</div>

<nav class="bottom-nav" aria-label="Navegación inferior">
  <div class="nav-pill">
    <a class="bottom-nav-item" href="cube.html" aria-label="Inicio"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></a>
    <a class="bottom-nav-item" href="cube.html" aria-label="Buscar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></a>
    <a class="bottom-nav-item" href="cube.html" aria-label="Orbe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg></a>
    <a class="bottom-nav-item activo" href="inventario.html" aria-label="Inventario" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><path d="M12 2.5 20.5 7v10L12 21.5 3.5 17V7z"/><path d="M3.5 7 12 11.5 20.5 7M12 11.5v10"/></svg></a>
  </div>
  <a class="bottom-nav-item" id="navPerfil" href="cube.html" aria-label="Perfil"></a>
</nav>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="cube-config.js"></script>
<script>
const IMG = 'https://cdn.jsdelivr.net/gh/Parallax-Oficial/cube@main/';
const RZ = { comun: 'Común', raro: 'Raro', extraordinario: 'Extraordinario', legendario: 'Legendario' };
const OR = { comun: 0, raro: 1, extraordinario: 2, legendario: 3 };
// Cada historia tiene su hueco fijo: [archivo, nombre, rareza, portada (solo para aclarar las de Eternamente Vivo)]
const CAT = [
  ['obedece','Obedece','comun'],['nada','Nada','comun'],['muevete-al-minuto','Muévete al Minuto','comun'],['valentine','Valentine','comun'],
  ['ultimate','Ultimate','comun'],['mama-dogs','Mama Dogs','comun'],['golem','Golem','comun'],['el-telefono','El Teléfono','comun'],
  ['bigfoot-2','Bigfoot','raro'],['strike','Strike','raro'],['retorcidos','Retorcidos','raro'],['metalosis-maligna','Metalosis Maligna','raro'],
  ['ratman','Ratman','raro'],['menem','Menem','raro'],['without-warning','Without Warning','raro'],
  ['eternamente-vivo','Eternamente Vivo 3','raro','Eternamente Vivo: con Amadeus Shell'],
  ['eternamente-vivo-dante','Eternamente Vivo 4','raro','Eternamente Vivo: con Dante el Grande'],
  ['eternamente-vivo-valak','Eternamente Vivo 5','raro','Eternamente Vivo: con Valak Seraphel'],
  ['eternamente-vivo-1','Eternamente Vivo 1','extraordinario','Eternamente Vivo'],
  ['triangle-room','Triangle Room','extraordinario'],['la-familia-rani','La Familia Rani','extraordinario'],
  ['eternamente-vivo-2','Eternamente Vivo 2','legendario','Eternamente Vivo: con Murray Franklin'],
  ['las-entrevistas','Las Entrevistas','legendario'],['divina-comedia','Divina Comedia','legendario']
].map(([a, t, r, s]) => ({ f: a + '.webp', t, r, s }));
CAT.sort((a, b) => OR[a.r] - OR[b.r]);   // de comunes a legendarias; dentro de cada rareza se respeta el orden de arriba
const porF = Object.fromEntries(CAT.map(s => [s.f, s]));

const $ = id => document.getElementById(id);
const db = (window.supabase && window.CUBE_SUPABASE_URL) ? supabase.createClient(window.CUBE_SUPABASE_URL, window.CUBE_SUPABASE_ANON_KEY) : null;
let user = null, tengo = new Map(), lect = new Map(), fav = new Set(), lis = new Set();

const ICO = {
  persona: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>',
  lista: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h12M3 11h12M3 16h7M18 13v8M14 17h8"/></svg>',
  fav: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>'
};
const toast = t => { const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 3200); };
const veces = f => lect.get(f) || 0;
const textoVeces = n => n === 1 ? 'Leída 1 vez.' : n ? `Leída ${n} veces.` : 'Aún sin leer.';
const cover = s => `<div class="cover"><span aria-hidden="true">+</span><img src="${IMG}${s.f}" alt="${s.t}" loading="lazy" onerror="this.remove()"></div>`;

function cabecera(nombre, foto) {
  const av = foto ? `<img src="${foto}" alt="">` : ICO.persona;
  $('ppAv').innerHTML = av; $('navPerfil').innerHTML = foto ? `<img src="${foto}" alt="">` : ICO.persona;
  $('ppNombre').textContent = nombre ? (nombre.startsWith('@') ? nombre : '@' + nombre) : 'Iniciar sesión';
}
function badge(email) {
  try { const n = (JSON.parse(localStorage.getItem('cube_notif_' + email) || '{}').items || []).filter(x => !x.leida).length; $('badge').textContent = n; $('badge').hidden = !n; } catch (e) {}
}

async function cargar() {
  let local = null; try { local = JSON.parse(localStorage.getItem('cube_sesion_activa') || 'null'); } catch (e) {}
  if (local) { cabecera(local.nombre, local.foto && local.foto.startsWith('data:image/jpeg') ? local.foto : null); badge(local.email); }
  try { if (db) { const { data } = await db.auth.getSession(); user = data && data.session ? data.session.user : null; } } catch (e) {}
  if (user) {
    const q = t => db.from(t);
    const [inv, pf, du, lc] = await Promise.all([
      q('inventario').select('historia').eq('user_id', user.id),
      q('profiles').select('username,avatar').eq('id', user.id).maybeSingle(),
      q('datos_usuario').select('favoritos,guardados').eq('id', user.id).maybeSingle(),
      q('lecturas').select('historia,veces').eq('user_id', user.id)]);
    (inv.data || []).forEach(r => tengo.set(r.historia, (tengo.get(r.historia) || 0) + 1));
    (lc.data || []).forEach(r => lect.set(r.historia, r.veces));
    if (du.data) { fav = new Set((du.data.favoritos || []).map(x => x.img)); lis = new Set((du.data.guardados || []).map(x => x.img)); }
    if (pf.data) cabecera(pf.data.username, pf.data.avatar && pf.data.avatar.startsWith('data:image/jpeg') ? pf.data.avatar : null);
    badge(user.email);
  } else if (!local) cabecera('', null);
  pintar();
}

function pintar() {
  const mias = CAT.filter(s => tengo.has(s.f)).concat([...tengo.keys()].filter(f => !porF[f]).map(f => ({ f, t: f.replace(/\.webp$/, '').replace(/-/g, ' ').replace(/^./, c => c.toUpperCase()), r: null })));
  $('grid').innerHTML = mias.map(s => `<article><div style="position:relative">${cover(s)}${tengo.get(s.f) > 1 ? `<span class="x">x${tengo.get(s.f)}</span>` : ''}
    <div class="acts"><button class="act" type="button" data-a="lis" data-f="${s.f}" aria-pressed="${lis.has(s.f)}" aria-label="Agregar a una lista">${ICO.lista}</button><button class="act" type="button" data-a="fav" data-f="${s.f}" aria-pressed="${fav.has(s.f)}" aria-label="Agregar a favoritos">${ICO.fav}</button></div></div>
    <button type="button" data-a="ver" data-f="${s.f}" style="text-align:left;display:block;width:100%"><p class="n">${s.t}</p><p class="rz">${s.r ? RZ[s.r] : ''}</p></button></article>`).join('');
  $('vacio').hidden = !(user && !mias.length);
  $('lista').innerHTML = CAT.map(s => { const tiene = tengo.has(s.f); return `<button class="fila${tiene ? '' : ' falta'}" type="button" data-a="ver" data-f="${s.f}">${cover(s)}<div><p class="t">${s.t}</p><p class="l">${tiene ? textoVeces(veces(s.f)) : 'Aún no la tienes.'}</p><span class="pill ${s.r}">${RZ[s.r]}</span></div></button>`; }).join('');
}

async function alternar(set, f, tipo) {
  if (!user) return toast('Inicia sesión en Cube para guardar historias.');
  const quitar = set.has(f); quitar ? set.delete(f) : set.add(f);
  pintar();
  const fa = [...fav].map(img => ({ img })), gu = [...lis].map(img => ({ img }));
  try { localStorage.setItem('cube_sesion_activa', JSON.stringify({ ...JSON.parse(localStorage.getItem('cube_sesion_activa') || 'null'), favoritos: fa, guardados: gu })); } catch (e) {}
  const { error } = await db.from('datos_usuario').upsert({ id: user.id, favoritos: fa, guardados: gu, updated_at: new Date().toISOString() });
  if (error) { quitar ? set.add(f) : set.delete(f); pintar(); return toast('No se pudo guardar. Intenta de nuevo.'); }
  toast(tipo === 'fav' ? (quitar ? 'Quitada de favoritos' : 'Agregada a favoritos') : (quitar ? 'Quitada de tu lista' : 'Agregada a tu lista'));
}

// Suma 1 lectura. También sirve desde el lector: cubeRegistrarLectura('bigfoot-2.webp')
async function leer(f) {
  if (!user) { toast('Inicia sesión en Cube para registrar lecturas.'); return null; }
  const { data, error } = await db.rpc('registrar_lectura', { p_historia: f });
  if (error) { toast(/tienes esta/i.test(error.message) ? 'Solo puedes leer historias de tu inventario.' : 'Falta ejecutar lecturas.sql en Supabase.'); return null; }
  lect.set(f, data); pintar(); return data;
}
window.cubeRegistrarLectura = leer;

function ver(f) {
  const s = porF[f] || { f, t: f, r: null }, tiene = tengo.has(f), m = $('modal');
  m.innerHTML = `<div class="hoja" role="dialog" aria-modal="true" aria-label="${s.t}">${cover(s)}<h2>${s.t}</h2>${s.s ? `<p>Portada: «${s.s}»</p>` : ''}
    ${s.r ? `<span class="pill ${s.r}">${RZ[s.r]}</span>` : ''}<p id="mv">${tiene ? textoVeces(veces(f)) : 'Aún no la tienes.'}</p>
    ${tiene ? '<button class="btn v" id="mLeer" type="button">Marcar como leída</button>' : '<a class="btn" href="lotes.html">Buscar en lotes</a>'}
    <button class="btn b" id="mX" type="button">Cerrar</button></div>`;
  m.hidden = false;
  const cerrar = () => { m.hidden = true; m.innerHTML = ''; };
  $('mX').onclick = cerrar; m.onclick = e => { if (e.target === m) cerrar(); };
  if (tiene) $('mLeer').onclick = async () => { const n = await leer(f); if (n != null) $('mv').textContent = textoVeces(n); };
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const f = b.dataset.f;
  if (b.dataset.a === 'ver') ver(f);
  else if (b.dataset.a === 'fav') alternar(fav, f, 'fav');
  else if (b.dataset.a === 'lis') alternar(lis, f, 'lis');
});
function pestana(k) {
  $('fold').dataset.tab = k;
  [['inv', 'tInv', 'pInv'], ['col', 'tCol', 'pCol']].forEach(([n, t, p]) => { const on = n === k; $(t).setAttribute('aria-selected', on); $(t).tabIndex = on ? 0 : -1; $(p).hidden = !on; });
}
$('tInv').onclick = () => pestana('inv'); $('tCol').onclick = () => pestana('col');
cabecera('', null); pintar(); cargar();
</script>
