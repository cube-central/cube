<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ECECEC">
<title>cube – Lotes</title>
<link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/gh/Parallax-Oficial/cube@main/cube-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--verde:#C6FF00;--fondo:#ECECEC;--negro:#0A0A0A;--oscuro:#171917;--suave:#6B6F68;--margen:3.4vw;--tarjeta:#fff;--tinta:#0A0A0A;--texto:#0A0A0A;
  --comun:#FFD60A;--raro:#E5484D;--extraordinario:#8B5CF6;--legendario:#D4A72C;--iw:clamp(96px,28vw,150px);color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--fondo)}
body{font-family:'Poppins',sans-serif;color:var(--negro);min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
@media(min-width:700px){:root{--margen:28px}}
.app{max-width:560px;margin:0 auto;padding-bottom:120px}
:focus-visible{outline:2px solid var(--negro);outline-offset:2px;border-radius:14px}

  .top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 12px) var(--margen) 8px}
  .perfil-pill{display:flex;align-items:center;gap:8px;min-width:0;max-width:46%;height:46px;padding:5px 16px 5px 5px;background:var(--tarjeta);border-radius:999px;font-weight:700;font-size:.98rem;color:var(--tinta);transition:transform .12s}
  .perfil-pill:active{transform:scale(.97)}
  .pp-av{flex:none;width:36px;height:36px;border-radius:50%;background:var(--verde);display:grid;place-items:center;overflow:hidden;color:var(--negro)}
  .pp-av svg{width:20px;height:20px}
  .pp-av img{width:100%;height:100%;object-fit:cover;display:block}
  .pp-nombre{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .top-acciones{display:flex;align-items:center}
  .top-ico{position:relative;flex:none;width:40px;height:44px;display:grid;place-items:center;color:var(--tinta);transition:transform .12s}
  .top-ico svg{width:25px;height:25px}
  .top-ico:active{transform:scale(.9)}
  .top-ico .cw-badge{top:3px;right:0}
  .top-ico:focus-visible,.circ:focus-visible,.riesgo:focus-visible,.platinum:focus-visible,.perfil-pill:focus-visible{outline:2px solid var(--tinta);outline-offset:2px;border-radius:14px}
  .cw-badge{position:absolute;top:-6px;right:-6px;min-width:18px;padding:1px 5px;border-radius:999px;background:var(--verde);color:var(--negro);font-size:.62rem;font-weight:700;line-height:1.4}
  .cw-badge[hidden]{display:none}
  .cw-vacio{padding:18px 0;color:var(--texto-suave);font-size:.85rem}

  /* barra inferior: píldora blanca + círculo verde de perfil */
  .bottom-nav{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(calc(100% - 2 * var(--margen)),540px);display:flex;align-items:flex-end;gap:12px;z-index:100;pointer-events:none;transition:opacity .35s ease,visibility .35s ease,transform .35s ease}
  .bottom-nav>*{pointer-events:auto}
  .bottom-nav.oculto{opacity:0;visibility:hidden;transform:translate(-50%,30px)}
  .nav-pill{flex:1;min-width:0;height:clamp(54px,15vw,64px);display:flex;align-items:center;justify-content:space-around;padding:0 6px;background:var(--tarjeta);border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
  .bottom-nav-item{display:flex;align-items:center;justify-content:center;color:#8D918A;transition:color .2s,transform .15s,background .2s}
  .nav-pill .bottom-nav-item{flex:0 0 auto;width:clamp(46px,13.6vw,58px);height:clamp(42px,11.6vw,50px);border-radius:50%}
  .nav-pill .bottom-nav-item svg{width:24px;height:24px}
  .bottom-nav-item:active{transform:scale(.92)}
  .nav-pill .bottom-nav-item.activo{background:var(--fondo);color:var(--tinta)}
  #navPerfil{flex:0 0 auto;width:clamp(62px,17.4vw,72px);height:clamp(62px,17.4vw,72px);border-radius:50%;background:var(--verde);color:var(--negro);overflow:hidden}
  #navPerfil svg{width:52%;height:52%}
  .nav-foto{width:100%;height:100%;object-fit:cover;display:block}
  .bottom-nav-item:focus-visible{outline:2px solid var(--tinta);outline-offset:2px}
.aviso-ses{margin:8px var(--margen) 0;padding:9px 16px;background:#fff;border-radius:999px;font-size:.78rem;text-align:center}
.aviso-ses a{font-weight:700;text-decoration:underline}
.hero{position:relative;margin:14px var(--margen) 0;aspect-ratio:2.2;border-radius:clamp(26px,8vw,40px);overflow:hidden;background:#fff}
.sl{position:absolute;inset:0;opacity:0;transition:opacity .7s}.sl.on{opacity:1}
.hero{container-type:inline-size}
.sl{display:flex;align-items:center;justify-content:space-between;gap:3cqw;padding:0 6cqw;text-align:left;background:var(--bg);color:var(--fg)}
.sl:not(.on){pointer-events:none}
.sl[data-k=void]{--bg:linear-gradient(120deg,#0b0d0b,#1f2d0a);--fg:#fff;--ac:#C6FF00;--bt:#0A0A0A}
.sl[data-k=horror]{--bg:linear-gradient(120deg,#2a070b,#7d1620);--fg:#fff;--ac:#E5484D;--bt:#fff}
.sl[data-k=flatulance]{--bg:linear-gradient(120deg,#8fc22a,#cdf06e);--fg:#1f3305;--ac:#1f3305;--bt:#EAFF9A}
.sl-tx{min-width:0}
.sl-t{font-weight:800;font-size:7.4cqw;letter-spacing:-.03em;line-height:1.05}
.sl-s{margin-top:1.2cqw;font-size:3cqw;line-height:1.3;opacity:.85}
.sl-b{display:inline-block;margin-top:3.2cqw;padding:1.1cqw 3.4cqw;border-radius:999px;background:var(--ac);color:var(--bt);font-weight:600;font-size:2.9cqw}
.sl-art{flex:none;height:78%;aspect-ratio:1;border-radius:5cqw;overflow:hidden;box-shadow:0 2cqw 6cqw -2cqw rgba(0,0,0,.5)}
.sl-art svg{width:100%;height:100%;display:block}
.dots{display:flex;justify-content:center;gap:8px;padding:16px 0 18px}
.dots button{width:11px;height:11px;border-radius:50%;background:#BDBDBD;transition:background .3s}
.dots button.on{background:#000}
.lotes{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,3vw,16px);padding:0 var(--margen)}
.lc{display:flex;flex-direction:column;text-align:left;background:#fff;border-radius:clamp(30px,10vw,52px);padding:clamp(16px,5.5vw,30px) clamp(14px,5.5vw,30px) clamp(18px,6vw,32px);transition:transform .15s}
.lc:active{transform:scale(.97)}
.lc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.lc-art{flex:none;width:40%;aspect-ratio:1;border-radius:12px;overflow:hidden}
.lc-art svg{width:100%;height:100%;display:block}
.lc-n{font-weight:400;color:#12A400;font-size:clamp(1.2rem,4.6vw,1.8rem);line-height:1.1;letter-spacing:-.02em}
.lc-nombre{margin-top:clamp(14px,5vw,26px);font-weight:400;color:#3B3D39;font-size:clamp(.95rem,4vw,1.4rem);line-height:1.15;white-space:nowrap}
.lc-precio{font-weight:500;font-size:clamp(1.1rem,4.6vw,1.65rem);line-height:1.25}
.volver{flex:none;width:38px;height:38px;border-radius:50%;background:#ECECEC;display:grid;place-items:center}
.volver svg{width:20px;height:20px}
.saldo-txt{margin-top:10px;text-align:center;font-size:.82rem;color:var(--suave)}

/* Vista de un lote: tarjeta blanca como en Inicio */
.card{margin:12px var(--margen) 0;background:#fff;border-radius:40px;padding:clamp(20px,6vw,30px) clamp(14px,4.4vw,22px) clamp(18px,5vw,26px)}
.card-cab{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 6px 16px}
.card-nombre{font-weight:700;font-size:clamp(1.3rem,5.6vw,1.7rem);letter-spacing:-.025em;line-height:1.1}
.precio{display:inline-flex;align-items:center;height:34px;padding:0 16px;background:var(--verde);border-radius:999px;font-weight:600;font-size:.92rem}

.reel-wrap{position:relative;background:var(--oscuro);border-radius:28px;overflow:hidden}
.reel{position:relative;height:calc(var(--iw) * .5625 + 44px);overflow:hidden;-webkit-mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.strip{position:absolute;left:0;top:0;height:100%;display:flex;align-items:center;gap:8px;will-change:transform}
.it{flex:none;width:var(--iw);transition:opacity .5s,transform .5s,filter .5s}
.it .po{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#2a2d28;border-bottom:4px solid var(--c);box-shadow:0 8px 20px -10px var(--c)}
.it img{width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:0;display:grid;place-items:center;padding:6px;text-align:center;font-size:.66rem;font-weight:600;line-height:1.2;color:#cfd3c6}
.it.comun{--c:var(--comun)}.it.raro{--c:var(--raro)}.it.extraordinario{--c:var(--extraordinario)}.it.legendario{--c:var(--legendario)}
.reel.fin .it:not(.win){opacity:.25;filter:grayscale(.7)}
.it.win{transform:scale(1.16)}
.it.win .po{box-shadow:0 0 0 2px var(--c),0 0 30px 2px var(--c)}
.marca{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--verde);box-shadow:0 0 14px 2px rgba(198,255,0,.65);z-index:3;pointer-events:none;border-radius:3px}
.marca::before,.marca::after{content:"";position:absolute;left:50%;margin-left:-8px;border:8px solid transparent}
.marca::before{top:0;border-top:11px solid var(--verde);border-bottom:0}
.marca::after{bottom:0;border-bottom:11px solid var(--verde);border-top:0}
.snd{position:absolute;right:10px;top:8px;z-index:4;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center}
.snd svg{width:16px;height:16px}

.btn{display:flex;align-items:center;justify-content:center;width:100%;height:clamp(52px,14vw,60px);margin-top:14px;border-radius:999px;background:var(--oscuro);color:var(--verde);font-weight:700;font-size:1.02rem;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.4;cursor:not-allowed}

/* Historias del lote: solo portadas con etiquetas, como en Inicio */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:18px var(--margen) 0}
.hc{position:relative;aspect-ratio:16/9;border-radius:22px;overflow:hidden;background:#fff}
.hc img{width:100%;height:100%;object-fit:cover;display:block}
.hc .ph{color:var(--suave);font-size:.74rem}
.rareza{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.68rem;font-weight:600;line-height:1.5}
.rareza.comun{background:#FFD60A;color:#0A0A0A}
.rareza.raro{background:#E5484D;color:#fff}
.rareza.extraordinario{background:#8B5CF6;color:#fff}
.rareza.legendario{background:#D4A72C;color:#0A0A0A}
.hc .rareza{position:absolute;left:9px;top:9px}
.hc .pct{position:absolute;right:9px;bottom:9px;padding:2px 9px;border-radius:999px;background:rgba(10,10,10,.78);color:#fff;font-size:.68rem;font-weight:600}

/* Resultado */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(10,10,10,.72);backdrop-filter:blur(6px);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.premio{width:min(100%,380px);background:#fff;border-radius:40px;padding:14px 14px 18px;text-align:center;position:relative;animation:pop .45s cubic-bezier(.2,1.4,.4,1);overflow:hidden}
@keyframes pop{from{transform:scale(.75);opacity:0}}
.premio.comun{--c:var(--comun)}.premio.raro{--c:var(--raro)}.premio.extraordinario{--c:var(--extraordinario)}.premio.legendario{--c:var(--legendario)}
.premio .po{position:relative;aspect-ratio:16/9;border-radius:28px;overflow:hidden;box-shadow:0 0 0 3px var(--c),0 12px 34px -8px var(--c);background:#d9dcd3}
.premio img{width:100%;height:100%;object-fit:cover;display:block}
.premio .rareza{margin-top:16px;font-size:.78rem;padding:3px 14px}
.premio h2{margin:8px 8px 0;font-weight:700;font-size:1.35rem;letter-spacing:-.02em;line-height:1.2}
.premio .acc{display:flex;gap:10px;margin:16px 6px 0}
.premio .acc .btn{margin-top:0;height:50px;font-size:.92rem}
.premio .acc .btn.b{background:#ECECEC;color:var(--negro)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);transform:translate(-50%,30px);z-index:60;max-width:90vw;padding:12px 20px;background:var(--negro);color:#fff;border-radius:22px;font-size:.84rem;opacity:0;pointer-events:none;transition:.3s;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

</style>
</head>
<body>
<div class="app">
    <header class="top">
    <button class="perfil-pill" id="btnPerfilTop" type="button" aria-label="Abrir perfil">
      <span class="pp-av" id="ppAv"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></span>
      <span class="pp-nombre" id="ppNombre">Iniciar sesión</span>
    </button>
    <div class="top-acciones">
      <button class="top-ico" type="button" aria-label="Crear lista" title="Crear lista"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h12M3 11h12M3 16h7M18 13v8M14 17h8"/></svg></button>
      <button class="top-ico" type="button" aria-label="Almacén" title="Almacén"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9"/><path d="M10 13h4"/></svg></button>
      <button class="top-ico" type="button" aria-label="Colección" title="Colección"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-1.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98 1.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg></button>
      <button class="top-ico" type="button" aria-label="Notificaciones" title="Notificaciones"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg></button>
    </div>
  </header>
  <div class="aviso-ses" id="avisoSes" hidden></div>
  <main id="vLista">
    <section class="hero" id="hero" aria-label="Destacados"></section>
    <div class="dots" id="dots"></div>
    <div class="lotes" id="lista"></div>
  </main>

  <main id="vLote" hidden>
    <section class="card">
      <div class="card-cab"><button class="volver" id="btnAtras" type="button" aria-label="Volver a lotes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><div class="card-nombre" style="flex:1" id="vlNombre"></div><span class="precio" id="vlPrecio"></span></div>
      <div class="reel-wrap">
        <button class="snd" id="btnSonido" type="button" aria-label="Sonido"></button>
        <div class="reel" id="reel"><div class="marca"></div><div class="strip" id="strip"></div></div>
      </div>
      <button class="btn" id="btnAbrir" type="button" disabled>Abrir lote</button>
      <p class="saldo-txt">Saldo: <span id="saldoN">—</span></p>
    </section>
    <div class="grid" id="grid"></div>
  </main>
</div>

<nav class="bottom-nav" id="bottomNav" aria-label="Navegación inferior">
  <div class="nav-pill">
    <button class="bottom-nav-item" id="navWallet" aria-label="Inicio">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    </button>
    <button class="bottom-nav-item" id="navHome" aria-label="Cube">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><path d="M12 2.5 20.5 7v10L12 21.5 3.5 17V7z"/><path d="M3.5 7 12 11.5 20.5 7M12 11.5v10"/></svg>
    </button>
    <button class="bottom-nav-item activo" id="navBuscar" aria-label="Buscar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
    <button class="bottom-nav-item" id="navOrbe" aria-label="Orbe">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>
    </button>
  </div>
  <button class="bottom-nav-item" id="navPerfil" aria-label="Perfil"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></button>
</nav>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="cube-config.js"></script>
<script>
const BASE_RAREZA = { comun: 55, raro: 28, extraordinario: 12, legendario: 5 };
const STORIES = {
  bigfoot:   { f:'bigfoot-2.webp', t:'Bigfoot', r:'raro' },
  obedece:   { f:'obedece.webp', t:'Obedece', r:'comun' },
  nada:      { f:'nada.webp', t:'Nada', r:'comun' },
  muevete:   { f:'muevete-al-minuto.webp', t:'Muévete al Minuto', r:'comun' },
  strike:    { f:'strike.webp', t:'Strike', r:'raro' },
  retorcidos:{ f:'retorcidos.webp', t:'Retorcidos', r:'raro' },
  valentine: { f:'valentine.webp', t:'Valentine', r:'comun' },
  ultimate:  { f:'ultimate.webp', t:'Ultimate', r:'comun' },
  metalosis: { f:'metalosis-maligna.webp', t:'Metalosis Maligna', r:'raro' },
  ratman:    { f:'ratman.webp', t:'Ratman', r:'raro' },
  ev_ext:    { f:'eternamente-vivo-1.webp', t:'Eternamente Vivo 1', r:'extraordinario' },
  ev_leg:    { f:'eternamente-vivo-2.webp', t:'Eternamente Vivo 2', r:'legendario' },
  ev3:       { f:'eternamente-vivo.webp', t:'Eternamente Vivo con Amadeus Shell', r:'raro' },
  ev4:       { f:'eternamente-vivo-dante.webp', t:'Eternamente Vivo con Dante el Grande', r:'raro' },
  ev5:       { f:'eternamente-vivo-valak.webp', t:'Eternamente Vivo con Valak Seraphel', r:'raro' },
  triangle:  { f:'triangle-room.webp', t:'Triangle Room', r:'extraordinario' },
  menem:     { f:'menem.webp', t:'Menem', r:'raro' },
  mama:      { f:'mama-dogs.webp', t:'Mama Dogs', r:'comun' },
  entrevistas:{ f:'las-entrevistas.webp', t:'Las Entrevistas', r:'legendario' },
  golem:     { f:'golem.webp', t:'Golem', r:'comun' },
  rani:      { f:'la-familia-rani.webp', t:'La Familia Rani', r:'extraordinario' },
  telefono:  { f:'el-telefono.webp', t:'El Teléfono', r:'comun' },
  divina:    { f:'divina-comedia.webp', t:'Divina Comedia', r:'legendario' },
  without:   { f:'without-warning.webp', t:'Without Warning', r:'raro' }
};
const LOTES = {
  horror: { nombre:'Horror Lot', precio:150, pool:['bigfoot','strike','retorcidos','valentine','metalosis','ratman','mama','golem','rani','without'] },
  sobrenatural: { nombre:'Supernatural Lot', precio:250, pool:['bigfoot','strike','valentine','ultimate','metalosis','ratman','ev3','ev4','ev5','triangle','entrevistas','divina','rani','telefono','without'] },
  flatulance: { nombre:'Flatulance Lot', precio:80, pool:['obedece','nada','muevete','valentine','ultimate','mama','golem','telefono'] },
  void: { nombre:'Void Lot', precio:400, base:{ comun:40, raro:30, extraordinario:18, legendario:12 }, pool:Object.keys(STORIES) }
};
function pesos(lote){
  const L = LOTES[lote], base = L.base || BASE_RAREZA, cnt = {}, out = {};
  L.pool.forEach(k => cnt[STORIES[k].r] = (cnt[STORIES[k].r]||0)+1);
  const tot = Object.keys(cnt).reduce((a,r)=>a+base[r],0);
  L.pool.forEach(k => { const r = STORIES[k].r; out[k] = base[r]/tot*100/cnt[r]; });
  return out;
}

const IMG_BASE = 'https://cdn.jsdelivr.net/gh/Parallax-Oficial/cube@main/';
const RAREZAS = { comun:'Común', raro:'Raro', extraordinario:'Extraordinario', legendario:'Legendario' };
const ORDEN = { legendario:0, extraordinario:1, raro:2, comun:3 };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtC = n => Number(n).toLocaleString('es-AR');
const fmtP = n => (Math.round(n * 100) / 100).toLocaleString('es-AR', { maximumFractionDigits: 2 });
const porArchivo = {}; Object.keys(STORIES).forEach(k => { STORIES[k].id = k; porArchivo[STORIES[k].f] = STORIES[k]; });

/* ---------- Diseño de cada lote (ilustraciones vectoriales) ---------- */
const hg=(id,c)=>`<radialGradient id="${id}" cx=".5" cy=".48" r=".62"><stop offset="0" stop-color="${c}" stop-opacity=".55"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient>`;
const lg=(id,a,b)=>`<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
function caja(k){
  const A={
  horror:`<defs>${lg('hb','#3d0b11','#110305')}${hg('hg','#E5484D')}</defs><rect width="100" height="100" fill="url(#hb)"/><rect width="100" height="100" fill="url(#hg)"/>
    <path d="M50 18c-17 0-28 11-28 26 0 9 4 15 10 19v9c0 3 2 5 5 5h26c3 0 5-2 5-5v-9c6-4 10-10 10-19 0-15-11-26-28-26z" fill="#F3EEE6"/>
    <ellipse cx="38" cy="45" rx="7.5" ry="8.5" fill="#1a0306"/><ellipse cx="62" cy="45" rx="7.5" ry="8.5" fill="#1a0306"/>
    <circle cx="38" cy="46" r="2.6" fill="#E5484D"/><circle cx="62" cy="46" r="2.6" fill="#E5484D"/>
    <path d="M50 54l-4.5 8h9z" fill="#1a0306"/>
    <path d="M41 72v8M47 72v9M53 72v9M59 72v8" stroke="#1a0306" stroke-width="2.2" stroke-linecap="round"/>`,
  sobrenatural:`<defs>${lg('sb','#2d1670','#0e0a2c')}${hg('sg','#8B5CF6')}</defs><rect width="100" height="100" fill="url(#sb)"/><rect width="100" height="100" fill="url(#sg)"/>
    <path d="M84 10a10 10 0 1 0 5 16 8 8 0 1 1-5-16z" fill="#CDBFFF"/>
    <path d="M29 78V45c0-12 9-21 21-21s21 9 21 21v33l-7-5-7 5-7-5-7 5-7-5-7 5z" fill="#F5F1FF"/>
    <ellipse cx="42" cy="46" rx="3.2" ry="4.4" fill="#2d1670"/><ellipse cx="58" cy="46" rx="3.2" ry="4.4" fill="#2d1670"/><ellipse cx="50" cy="58" rx="3" ry="4.2" fill="#2d1670"/>
    <g fill="#fff"><circle cx="16" cy="24" r="1.6"/><circle cx="22" cy="60" r="1.2"/><circle cx="82" cy="62" r="1.4"/><path d="M14 40l1.4 3.6 3.6 1.4-3.6 1.4L14 50l-1.4-3.6L9 45l3.6-1.4z"/></g>`,
  flatulance:`<defs>${lg('fb','#a8d93a','#5a8419')}</defs><rect width="100" height="100" fill="url(#fb)"/>
    <g fill="#F4FFD6"><circle cx="35" cy="52" r="12"/><circle cx="50" cy="44" r="15"/><circle cx="66" cy="52" r="12"/><rect x="24" y="52" width="54" height="15" rx="7.5"/></g>
    <circle cx="43" cy="55" r="2.5" fill="#3d5a0b"/><circle cx="58" cy="55" r="2.5" fill="#3d5a0b"/><path d="M44 61q6.5 5.5 13 0" fill="none" stroke="#3d5a0b" stroke-width="2.2" stroke-linecap="round"/>
    <g fill="#F4FFD6" opacity=".85"><circle cx="84" cy="64" r="5"/><circle cx="92" cy="56" r="3.2"/><circle cx="14" cy="72" r="4"/><circle cx="8" cy="64" r="2.6"/></g>`,
  void:`<defs>${lg('vb','#16181a','#040505')}${hg('vg','#C6FF00')}</defs><rect width="100" height="100" fill="url(#vb)"/><rect width="100" height="100" fill="url(#vg)"/>
    <ellipse cx="50" cy="50" rx="40" ry="12" transform="rotate(-18 50 50)" fill="none" stroke="#C6FF00" stroke-width="2.2" opacity=".85"/>
    <circle cx="50" cy="50" r="22" fill="none" stroke="#C6FF00" stroke-width="1.4" opacity=".35"/>
    <circle cx="50" cy="50" r="15" fill="#000" stroke="#C6FF00" stroke-width="3"/>
    <g fill="#C6FF00"><circle cx="14" cy="18" r="1.4"/><circle cx="84" cy="22" r="1.1"/><circle cx="20" cy="84" r="1.2"/><circle cx="86" cy="80" r="1.5"/></g>`
  }[k];
  return `<svg viewBox="0 0 100 100" aria-hidden="true">${A}</svg>`;
}
/* ---------- Heros (banners promocionales de lotes) ---------- */
const HEROES=[{k:'void',sub:'Entra al vacío y llévate algo único'},{k:'horror',sub:'Terror para los que no duermen'},{k:'flatulance',sub:'Humor explosivo, risas aseguradas'}];
/* ---------- Estado y sesión ---------- */
const db = (window.supabase && window.CUBE_SUPABASE_URL) ? supabase.createClient(window.CUBE_SUPABASE_URL, window.CUBE_SUPABASE_ANON_KEY) : null;
let user = null, saldo = null, listo = false, loteK = null, busy = false, sonido = true, idleRAF = 0, ctxA = null;

async function cargarSesion() {
  try {
    if (db) { const { data } = await db.auth.getSession(); user = data && data.session ? data.session.user : null; }
  } catch (e) { user = null; }
  const av = $('avisoSes');
  if (user) { av.hidden = true; const m = user.user_metadata || {}; $('ppNombre').textContent = '@' + (m.username || m.user_name || m.name || (user.email || 'usuario').split('@')[0]); await cargarSaldo(); }
  else {
    $('saldoN').textContent = 'Demo';
    av.hidden = false;
    av.innerHTML = 'Modo demo: no se gastan créditos. <a href="cube.html">Inicia sesión</a>';
  }
  listo = true; if (loteK) pintarBoton();
}
async function cargarSaldo() {
  try {
    const { data, error } = await db.from('wallets').select('creditos').eq('user_id', user.id).maybeSingle();
    if (error) throw error;
    saldo = Number(data ? data.creditos : 0);
    $('saldoN').textContent = '$' + fmtC(saldo);
  } catch (e) { saldo = null; $('saldoN').textContent = '—'; }
}
function toast(t) { const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 5000); }

/* ---------- Lista ---------- */
function portada(s) {
  return `<img src="${IMG_BASE}${s.f}" alt="${esc(s.t)}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ph',textContent:this.alt}))">`;
}
function pintarLista() {
  $('lista').innerHTML = Object.keys(LOTES).map(k => {
    const L = LOTES[k];
    return `<button class="lc" type="button" data-k="${k}" aria-label="${esc(L.nombre)}, ${L.pool.length} historias, $${L.precio}">
      <div class="lc-top"><div class="lc-art">${caja(k)}</div><span class="lc-n">+${L.pool.length}</span></div>
      <div class="lc-nombre">${esc(L.nombre)}</div><div class="lc-precio">$${fmtC(L.precio)}</div></button>`;
  }).join('');
  $('lista').querySelectorAll('.lc').forEach(b => b.onclick = () => { location.hash = b.dataset.k; });
}
let heroI = 0;
function pintarHero() {
  $('hero').innerHTML = HEROES.map((h, i) => { const L = LOTES[h.k]; return `<button type="button" class="sl${i ? '' : ' on'}" data-k="${h.k}" aria-label="${esc(L.nombre)}, $${L.precio}"><div class="sl-tx"><div class="sl-t">${esc(L.nombre)}</div><div class="sl-s">${h.sub}</div><span class="sl-b">+${L.pool.length} historias · $${fmtC(L.precio)}</span></div><div class="sl-art">${caja(h.k)}</div></button>`; }).join('');
  $('dots').innerHTML = HEROES.map((_, i) => `<button type="button" class="${i ? '' : 'on'}" aria-label="Destacado ${i + 1}"></button>`).join('');
  const ir = i => { heroI = i; document.querySelectorAll('.sl').forEach((e, j) => e.classList.toggle('on', j === i)); document.querySelectorAll('#dots button').forEach((e, j) => e.classList.toggle('on', j === i)); };
  document.querySelectorAll('#dots button').forEach((b, i) => b.onclick = () => ir(i));
  document.querySelectorAll('.sl').forEach(b => b.onclick = () => { location.hash = b.dataset.k; });
  setInterval(() => { if (!$('vLista').hidden) ir((heroI + 1) % HEROES.length); }, 5000);
}

/* ---------- Vista de un lote ---------- */
const itemHTML = s => `<div class="it ${s.r}"><div class="po">${portada(s)}</div></div>`;
const pool = () => LOTES[loteK].pool.map(k => STORIES[k]);
function pintarBoton() {
  const L = LOTES[loteK], b = $('btnAbrir');
  if (!listo) { b.textContent = 'Cargando…'; b.disabled = true; return; }
  const sinCred = !!user && saldo !== null && saldo < L.precio;
  b.textContent = busy ? 'Abriendo…' : sinCred ? 'Créditos insuficientes' : user ? 'Abrir lote' : 'Probar gratis';
  b.disabled = busy || sinCred;
}
function abrirVistaLote(k) {
  loteK = k; const L = LOTES[k], W = pesos(k);
  $('vLista').hidden = true; $('vLote').hidden = false; 
  $('vlNombre').textContent = L.nombre; $('vlPrecio').textContent = '$' + fmtC(L.precio);
  $('grid').innerHTML = pool().slice().sort((a, b) => ORDEN[a.r] - ORDEN[b.r] || a.t.localeCompare(b.t, 'es')).map(s =>
    `<div class="hc" title="${esc(s.t)}">${portada(s)}<span class="rareza ${s.r}">${RAREZAS[s.r]}</span><span class="pct">${fmtP(W[s.id])}%</span></div>`).join('');
  $('btnSonido').innerHTML = iconoSonido();
  pintarBoton(); iniciarIdle(); window.scrollTo(0, 0);
}
function abrirLista() {
  detenerIdle(); loteK = null;
  $('vLote').hidden = true; $('vLista').hidden = false;
  window.scrollTo(0, 0);
}
function ruta() {
  const k = decodeURIComponent(location.hash.slice(1));
  if (busy) return;
  if (LOTES[k]) abrirVistaLote(k); else abrirLista();
}
$('btnAtras').addEventListener('click', e => {
  if (loteK) { e.preventDefault(); if (!busy) location.hash = ''; }
});
window.addEventListener('hashchange', ruta);

/* ---------- Ruleta ---------- */
const strip = $('strip'), reel = $('reel');
const iw = () => { const a = strip.children[0], b = strip.children[1]; return a && b ? b.getBoundingClientRect().left - a.getBoundingClientRect().left : 110; };
function iniciarIdle() {
  detenerIdle(); reel.classList.remove('fin');
  const set = pool().slice().sort(() => Math.random() - .5);
  let html = ''; for (let i = 0; i < 6; i++) html += set.map(itemHTML).join('');
  strip.innerHTML = html; strip.style.transform = 'translate3d(0,0,0)';
  const ancho = iw(), ciclo = ancho * set.length; let x = Math.random() * ciclo;
  const paso = () => { x = (x + .35) % ciclo; strip.style.transform = `translate3d(${-x}px,0,0)`; idleRAF = requestAnimationFrame(paso); };
  idleRAF = requestAnimationFrame(paso);
}
function detenerIdle() { cancelAnimationFrame(idleRAF); idleRAF = 0; }

function tick() {
  if (!sonido) return;
  try {
    ctxA = ctxA || new (window.AudioContext || window.webkitAudioContext)();
    const o = ctxA.createOscillator(), g = ctxA.createGain(), t = ctxA.currentTime;
    o.type = 'square'; o.frequency.setValueAtTime(900, t); o.frequency.exponentialRampToValueAtTime(380, t + .04);
    g.gain.setValueAtTime(.04, t); g.gain.exponentialRampToValueAtTime(.001, t + .05);
    o.connect(g).connect(ctxA.destination); o.start(t); o.stop(t + .06);
  } catch (e) {}
}
function fanfarria(r) {
  if (!sonido || !ctxA) return;
  try {
    const notas = r === 'legendario' ? [523, 659, 784, 1047] : r === 'extraordinario' ? [523, 659, 784] : [523, 659];
    notas.forEach((f, i) => { const o = ctxA.createOscillator(), g = ctxA.createGain(), t = ctxA.currentTime + i * .11;
      o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(.08, t); g.gain.exponentialRampToValueAtTime(.001, t + .35);
      o.connect(g).connect(ctxA.destination); o.start(t); o.stop(t + .4); });
  } catch (e) {}
}
function iconoSonido() {
  return sonido
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
}
$('btnSonido').onclick = () => { sonido = !sonido; $('btnSonido').innerHTML = iconoSonido(); };

function girar(ganadora) {
  return new Promise(res => {
    detenerIdle(); reel.classList.remove('fin');
    const p = pool(), N = 70, IDX = 60, items = [];
    for (let i = 0; i < N; i++) items.push(i === IDX ? ganadora : p[Math.floor(Math.random() * p.length)]);
    strip.innerHTML = items.map(itemHTML).join('');
    strip.style.transform = 'translate3d(0,0,0)';
    const ancho = iw(), vw = reel.clientWidth;
    const fin = IDX * ancho + ancho / 2 - vw / 2 + (Math.random() - .5) * ancho * .6;
    const dur = matchMedia('(prefers-reduced-motion:reduce)').matches ? 1800 : 7600;
    const t0 = performance.now(); let ult = -1;
    const ease = t => 1 - Math.pow(1 - t, 3.8);
    const paso = now => {
      const t = Math.min(1, (now - t0) / dur), x = fin * ease(t);
      strip.style.transform = `translate3d(${-x}px,0,0)`;
      const i = Math.floor((x + vw / 2) / ancho);
      if (i !== ult) { ult = i; tick(); }
      if (t < 1) requestAnimationFrame(paso);
      else { reel.classList.add('fin'); strip.children[IDX].classList.add('win'); res(); }
    };
    requestAnimationFrame(paso);
  });
}
function sorteoLocal() {
  const W = pesos(loteK), ks = Object.keys(W); let r = Math.random() * 100, a = 0;
  for (const k of ks) { a += W[k]; if (r <= a) return STORIES[k]; }
  return STORIES[ks[ks.length - 1]];
}
function msgError(e) {
  const m = String((e && (e.message || e.details || e.hint)) || e);
  if (m.includes('sin_creditos')) return 'No tienes créditos suficientes para este lote.';
  if (m.includes('lote_completo')) return 'Ya tienes todas las historias disponibles de este lote.';
  if (m.includes('no_sesion')) return 'Tu sesión expiró. Vuelve a iniciar sesión en Cube.';
  if (m.includes('abrir_lote') || m.includes('PGRST202') || m.includes('schema cache')) return 'Falta instalar la función abrir_lote en Supabase (ejecuta lotes.sql).';
  return 'No se pudo abrir el lote: ' + m.slice(0, 110);
}
async function abrir() {
  if (busy || !loteK || !listo) return;
  const L = LOTES[loteK];
  try { ctxA = ctxA || new (window.AudioContext || window.webkitAudioContext)(); ctxA.resume && ctxA.resume(); } catch (e) {}
  let ganadora, nuevoSaldo = null;
  busy = true; pintarBoton();
  if (user) {
    try {
      const { data, error } = await db.rpc('abrir_lote', { p_lote: loteK });
      if (error) throw error;
      if (!data || !porArchivo[data.historia]) throw new Error('Respuesta inesperada del servidor');
      ganadora = porArchivo[data.historia]; nuevoSaldo = Number(data.saldo);
    } catch (e) {
      console.warn('Error al abrir lote', e);
      busy = false; await cargarSaldo(); pintarBoton();
      return toast(msgError(e));
    }
    saldo = nuevoSaldo;
  } else ganadora = sorteoLocal();
  await girar(ganadora);
  if (nuevoSaldo !== null) $('saldoN').textContent = '$' + fmtC(nuevoSaldo);
  fanfarria(ganadora.r);
  setTimeout(() => { busy = false; pintarBoton(); mostrarPremio(ganadora); }, 800);
}
$('btnAbrir').onclick = abrir;

function mostrarPremio(s) {
  const m = $('modal'), L = LOTES[loteK], puede = !user || saldo === null || saldo >= L.precio;
  m.innerHTML = `<div class="premio ${s.r}" role="dialog" aria-modal="true" aria-label="Ganaste ${esc(s.t)}">
    <div class="po">${portada(s)}</div>
    <span class="rareza ${s.r}">${RAREZAS[s.r]}</span><h2>${esc(s.t)}</h2>
    <div class="acc"><button class="btn b" id="mCerrar" type="button">Cerrar</button><button class="btn" id="mOtra" type="button"${puede ? '' : ' disabled'}>${puede ? 'Abrir otro · $' + fmtC(L.precio) : 'Sin créditos'}</button></div>
  </div>`;
  m.hidden = false;
  const cerrar = () => { m.hidden = true; m.innerHTML = ''; iniciarIdle(); };
  $('mCerrar').onclick = cerrar;
  $('mOtra').onclick = () => { m.hidden = true; m.innerHTML = ''; abrir(); };
  m.onclick = e => { if (e.target === m) cerrar(); };
}

pintarLista(); pintarHero(); ruta(); cargarSesion();
const ir = u => () => { if (!busy) location.href = u; };
$('navWallet').onclick = ir('cube.html'); $('navHome').onclick = ir('inventario.html');
$('navPerfil').onclick = ir('cube.html'); $('btnPerfilTop').onclick = ir('cube.html');
document.querySelectorAll('.top-ico').forEach(b => b.onclick = ir('cube.html'));
$('navBuscar').onclick = () => { if (!busy) { location.hash = ''; ruta(); window.scrollTo(0, 0); } };
$('navOrbe').onclick = () => toast('Orbe activada.');
</script>
</body>
</html>
