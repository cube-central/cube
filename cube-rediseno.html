<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cube · Rediseño</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--verde:#C6FF00;--card:#121212;--linea:rgba(255,255,255,.08);--suave:#8a8d87;--m:20px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#000}
body{font-family:'Open Sans',system-ui,sans-serif;color:#fff;background:radial-gradient(120% 60% at 0 0,#10160a 0%,#050605 45%,#000 100%) fixed;min-height:100svh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.i{width:1em;height:1em;display:block;flex:none}
.app{max-width:480px;margin:0 auto;min-height:100svh;padding:0 0 130px;overflow-x:clip}
.view{display:none}.view.on{display:block;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2.sec{font:600 1.15rem 'Poppins',sans-serif;letter-spacing:-.01em;padding:0 var(--m)}
.sec-h{display:flex;align-items:center;justify-content:space-between;padding-right:var(--m);margin-top:34px}
.sec-h button{display:flex;align-items:center;gap:2px;font:500 .8rem 'Open Sans';color:var(--suave)}
.sec-h button svg{font-size:1rem}
.row{display:flex;gap:12px;overflow-x:auto;padding:14px var(--m) 4px;scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding-left:var(--m)}
.row::-webkit-scrollbar{display:none}
.row>*{scroll-snap-align:start}

/* cabecera */
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 16px) var(--m) 0}
.me{display:flex;align-items:center;gap:10px;text-align:left}
.av{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--c,var(--verde));color:var(--tx,#0a0a0a);font:700 .9rem 'Poppins'}
.me b{display:block;font:600 .95rem 'Poppins'}.me small{color:var(--suave);font-size:.75rem}
.ico{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--linea);display:grid;place-items:center;font-size:1.3rem}
.page-t{font:700 1.9rem/1.1 'Poppins';letter-spacing:-.02em;padding:22px var(--m) 0}
.page-s{padding:6px var(--m) 0;color:var(--suave);font-size:.88rem}

/* caja de créditos */
.caja{margin:22px var(--m) 0;padding:22px 22px 20px;border-radius:30px;background:#0f1209;border:1px solid var(--linea)}
.caja small{font:500 .65rem 'Poppins';letter-spacing:.16em;color:#7d827b}
.caja .m{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.caja .m b{font:600 2.1rem 'Poppins';letter-spacing:-.02em}
.caja .m button{font-size:1.4rem;color:#9a9f98}
.caja .acc{display:flex;gap:8px;margin-top:16px}
.pill{padding:10px 18px;border-radius:99px;background:#1b1d1a;font:500 .8rem 'Poppins'}
.pill.v{background:var(--verde);color:#0a0a0a;font-weight:600}

/* sugerencias */
.sg{flex:0 0 150px;height:92px;border-radius:24px;padding:14px;display:flex;align-items:flex-end;font:700 1.15rem/1.05 'Poppins';letter-spacing:-.02em}

/* listas: círculo con aro verde ácido plano */
.li{--s:72px;flex:none;display:flex;flex-direction:column;align-items:center;gap:9px;width:84px}
.ring{width:var(--s);height:var(--s);padding:4px;border-radius:50%;background:linear-gradient(135deg,#E6FF4D,#C6FF00 50%,#7FB800)}
.ring i{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;border:4px solid #000;background:var(--c);color:var(--tx,#fff);font:700 1.4rem 'Poppins';font-style:normal}
.li span{display:block;max-width:100%;font-size:.74rem;color:#d9dcd6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* discusiones populares (estilo Plex, sin portadas) */
.dc{flex:0 0 min(86%,330px);display:flex;flex-direction:column;border-radius:30px;overflow:hidden;background:color-mix(in srgb,var(--h) 16%,#0b0b0b);border:1px solid var(--linea);text-align:left}
.dc-art{position:relative;height:124px;display:flex;align-items:flex-end;padding:16px 20px;background:linear-gradient(160deg,color-mix(in srgb,var(--h) 85%,#000),color-mix(in srgb,var(--h) 25%,#000))}
.dc-art b{font:700 1.7rem/1 'Poppins';letter-spacing:-.03em;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.dc-tag{position:absolute;top:14px;left:20px;font:600 .62rem 'Poppins';letter-spacing:.14em;text-transform:uppercase;padding:5px 10px;border-radius:99px;background:rgba(0,0,0,.35)}
.dc-b{flex:1;padding:18px 20px 6px}
.dc-b h3{font:700 1.05rem/1.28 'Poppins';letter-spacing:-.01em}
.dc-b p{margin-top:8px;color:#b9b3a8;font-size:.86rem;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dc-u{display:flex;align-items:center;gap:10px;margin:16px 0 14px}
.dc-u .av{width:38px;height:38px;font-size:.8rem}
.dc-u b{display:block;font:600 .85rem 'Poppins'}.dc-u small{color:#a8a296;font-size:.74rem}
.dc-f{display:flex;background:color-mix(in srgb,var(--h) 30%,#141414)}
.dc-f button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:14px 8px;font:500 .85rem 'Poppins';border-left:1px solid rgba(0,0,0,.35)}
.dc-f button:first-child{border:0;flex:1.5;justify-content:flex-start;padding-left:18px}
.dc-f svg{font-size:1.25rem}.dc-f .on{color:var(--verde)}
.rx{display:flex}.rx i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 .6rem/1 sans-serif;font-style:normal;color:#fff;border:2px solid #1a1a1a;margin-left:-6px}.rx i:first-child{margin:0}
.list-v{display:flex;flex-direction:column;gap:16px;padding:16px var(--m) 0}
.list-v .dc{flex:none}

/* escenario glass: manchas de color para que el vidrio tenga qué difuminar */
.stage{position:relative;margin-top:14px;padding:26px 0 30px;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 22px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(transparent,#000 22px,#000 calc(100% - 22px),transparent)}
.stage::before,.stage::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;filter:blur(60px);opacity:.75;pointer-events:none}
.stage::before{left:-90px;top:10px;background:#6a2bff}
.stage::after{right:-100px;bottom:-30px;background:#10d466}
.stage .blob3{position:absolute;left:35%;top:40%;width:200px;height:200px;border-radius:50%;filter:blur(70px);background:#C6FF00;opacity:.35;pointer-events:none}
.stage>*:not(.blob3){position:relative;z-index:1}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.05));-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);border:1px solid rgba(255,255,255,.26);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 24px 40px -24px rgba(0,0,0,.7)}

/* reseñas (tarjeta glass) */
.rv{flex:0 0 min(86%,330px);border-radius:34px;padding:20px 22px 16px;text-align:left}
.rv-h{display:flex;align-items:center;gap:12px}
.rv-h .av{width:46px;height:46px}
.rv-h b{display:block;font:500 .95rem 'Poppins'}.rv-h small{color:rgba(255,255,255,.7);font-size:.78rem}
.stars{display:flex;gap:5px;margin:16px 0 12px;font-size:1.7rem;color:rgba(255,255,255,.28)}
.stars .f{color:#f3f3ee}
.rv p{color:rgba(255,255,255,.88);font-size:.88rem;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rv-f{display:flex;align-items:center;justify-content:space-between;margin-top:14px;color:rgba(255,255,255,.8);font-size:1.4rem}
.rv-f .l{display:flex;gap:16px}.rv-f .r{display:flex;align-items:center;gap:8px;font:500 .9rem 'Poppins'}
.rv-st{font:600 .7rem 'Poppins';letter-spacing:.12em;text-transform:uppercase;color:var(--verde);margin-top:12px}

/* noticias: tarjeta translúcida inclinada */
.nz-stage{perspective:1000px;padding:34px var(--m) 40px}
.nz-wrap{position:relative;transform-style:preserve-3d;transform:rotateX(7deg) rotateY(-9deg) rotateZ(-2deg);animation:flota 6s ease-in-out infinite}
@keyframes flota{0%,100%{transform:rotateX(7deg) rotateY(-9deg) rotateZ(-2deg) translateY(0)}50%{transform:rotateX(5deg) rotateY(-6deg) rotateZ(-1.5deg) translateY(-6px)}}
.nz-back{position:absolute;inset:0;border-radius:34px;background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.14)}
.nz-back.b1{transform:translate3d(18px,20px,-36px)}.nz-back.b2{transform:translate3d(34px,40px,-72px);opacity:.6}
.nz{position:relative;border-radius:34px;overflow:hidden;text-align:left;width:100%;display:block}
.nz-h{display:flex;align-items:center;gap:11px;padding:14px 18px;background:rgba(10,8,40,.45);border-bottom:1px solid rgba(255,255,255,.14)}
.nz-logo{flex:none;width:36px;height:36px;border-radius:50%;background:var(--verde);color:#0a0a0a;display:grid;place-items:center;font-size:1.25rem}
.nz-h b{display:block;font:600 .85rem 'Poppins'}.nz-h small{color:rgba(255,255,255,.7);font-size:.72rem}
.nz-h .t{margin-left:auto;font:500 .72rem 'Poppins';color:rgba(255,255,255,.8);white-space:nowrap}
.nz-v{position:relative;padding:20px 20px 18px;background:linear-gradient(160deg,rgba(138,43,255,.55),rgba(0,0,0,.55) 70%)}
.nz-live{display:inline-flex;align-items:center;gap:7px;font:700 .64rem 'Poppins';letter-spacing:.14em;text-transform:uppercase;padding:6px 11px;border-radius:99px;background:var(--verde);color:#0a0a0a}
.nz-live i{width:7px;height:7px;border-radius:50%;background:#0a0a0a;animation:pulso 1.2s infinite}
@keyframes pulso{50%{opacity:.2}}
.nz-dl{margin-top:16px;font:500 .66rem 'Poppins';letter-spacing:.12em;color:rgba(255,255,255,.75)}
.nz-v h3{margin-top:8px;font:700 1.55rem/1.12 'Poppins';letter-spacing:-.025em}
.nz-v p{margin-top:10px;color:rgba(255,255,255,.85);font-size:.86rem;line-height:1.5}
.tick{overflow:hidden;white-space:nowrap;background:#000;border-top:1px solid rgba(255,255,255,.14);padding:9px 0;font:600 .68rem 'Poppins';letter-spacing:.1em;color:var(--verde)}
.tick span{display:inline-block;animation:cr 26s linear infinite}
@keyframes cr{to{transform:translateX(-50%)}}
.nz-f{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:rgba(20,10,80,.55);font-size:.78rem;color:rgba(255,255,255,.85)}
.nz-f .r{display:flex;align-items:center;gap:9px;font:500 .85rem 'Poppins'}
.leer{padding:8px 16px;border-radius:99px;background:rgba(255,255,255,.92);color:#0a0a0a;font:600 .75rem 'Poppins'}
.nz-meta{display:flex;gap:18px;padding:0 var(--m);margin-top:6px;color:var(--suave);font-size:.78rem}

/* buscador glass */
.bs-stage{padding:30px 0 34px}
.bs{display:flex;align-items:center;gap:12px;margin:0 var(--m);height:62px;padding:0 22px;border-radius:99px}
.bs svg{font-size:1.4rem;color:rgba(255,255,255,.85)}
.bs input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:500 1rem 'Open Sans'}
.bs input::placeholder{color:rgba(255,255,255,.75)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:16px var(--m) 0}
.chip{padding:9px 16px;border-radius:99px;font:500 .8rem 'Poppins';background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.chip.on{background:var(--verde);color:#0a0a0a;border-color:var(--verde)}
.res{display:flex;flex-direction:column;padding:6px var(--m) 0}
.rs{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--linea);text-align:left;width:100%}
.rs .mono{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--c);color:var(--tx,#fff);font:700 1.3rem 'Poppins'}
.rs b{display:block;font:600 .95rem 'Poppins'}.rs small{color:var(--suave);font-size:.78rem}
.rs .go{margin-left:auto;color:var(--suave);font-size:1.2rem}
.vacio{padding:24px var(--m);color:var(--suave);font-size:.88rem}

/* pestañas de Descubrir */
.tabs{display:flex;gap:6px;padding:20px var(--m) 0}
.tab{padding:10px 20px;border-radius:99px;font:500 .9rem 'Poppins';color:#b8bbb4;border:1px solid transparent}
.tab.on{border-color:rgba(255,255,255,.5);color:#fff}
.crear{display:flex;align-items:center;justify-content:center;gap:8px;margin:18px var(--m) 0;padding:15px;border-radius:99px;background:var(--verde);color:#0a0a0a;font:600 .9rem 'Poppins';width:calc(100% - 2*var(--m))}
.crear svg{font-size:1.1rem}

/* barra inferior (plana) */
.nb{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;display:flex;gap:10px;align-items:center}
.nb-seg{display:flex;padding:5px;border-radius:99px;background:#121412;border:1px solid var(--linea)}
.nb-seg button{display:flex;align-items:center;gap:7px;padding:0 16px;height:48px;border-radius:99px;font:500 .8rem 'Poppins';color:#cfd2cc}
.nb-seg button svg{font-size:1.2rem}
.nb-seg button.on{background:var(--verde);color:#0a0a0a;font-weight:600}
.nb-seg button:not(.on) span{display:none}
.nb-s{width:58px;height:58px;border-radius:50%;background:#121412;border:1px solid var(--linea);display:grid;place-items:center;font-size:1.4rem}
.nb-s.on{background:var(--verde);color:#0a0a0a}

/* hoja inferior */
.sh{position:fixed;inset:0;z-index:100;display:none;align-items:flex-end;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
.sh.on{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sh-c{width:100%;max-width:480px;margin:0 auto;max-height:90svh;overflow-y:auto;background:#111310;border-radius:32px 32px 0 0;border:1px solid var(--linea);border-bottom:0;padding:10px var(--m) calc(26px + env(safe-area-inset-bottom,0px));animation:sube .32s cubic-bezier(.2,.8,.2,1)}
@keyframes sube{from{transform:translateY(40px);opacity:.4}}
.grip{width:44px;height:4px;border-radius:4px;background:#333;margin:0 auto 16px}
.sh-c h3{font:700 1.3rem/1.2 'Poppins';letter-spacing:-.02em}
.lbl{margin:18px 0 8px;font:500 .72rem 'Poppins';letter-spacing:.1em;text-transform:uppercase;color:var(--suave)}
.fld{width:100%;padding:14px 16px;border-radius:18px;background:#1b1d1a;border:1px solid var(--linea);color:#fff;font:400 .95rem 'Open Sans';outline:0}
.fld:focus{border-color:var(--verde)}textarea.fld{min-height:96px;resize:none}
.wrapc{display:flex;flex-wrap:wrap;gap:8px}
.wrapc .chip{background:#1b1d1a;border-color:var(--linea);-webkit-backdrop-filter:none;backdrop-filter:none}
.wrapc .chip.on{background:var(--verde)}
.btn{width:100%;margin-top:20px;padding:15px;border-radius:99px;background:var(--verde);color:#0a0a0a;font:600 .95rem 'Poppins'}
.btn.s{background:#1b1d1a;color:#fff;margin-top:10px}
.pick{font-size:2rem;display:flex;gap:6px;color:#3b3e39}.pick .f{color:var(--verde)}
.cm{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--linea)}
.cm b{font:600 .85rem 'Poppins'}.cm p{margin-top:3px;color:#c9ccc5;font-size:.88rem;line-height:1.5}
.art p{margin-top:14px;color:#d4d7d0;font-size:.95rem;line-height:1.7}
.art .dl{margin-top:10px;font:500 .68rem 'Poppins';letter-spacing:.12em;color:var(--suave)}
.opt{display:block;width:100%;text-align:left;margin-top:10px;padding:15px 18px;border-radius:20px;background:#1b1d1a;border:1px solid var(--linea);font:500 .88rem/1.35 'Poppins'}
.opt.on{border-color:var(--verde)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 16px);transform:translate(-50%,-90px);z-index:200;padding:12px 20px;border-radius:99px;background:var(--verde);color:#0a0a0a;font:600 .82rem 'Poppins';transition:transform .35s cubic-bezier(.2,.9,.3,1.2);white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.nz-wrap,.tick span,.nz-live i{animation:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-news" viewBox="0 0 24 24"><path d="M5 4h11v15a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1zM16 8h3v10a2 2 0 0 1-2 2M8 8h5M8 12h5M8 16h3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-comp" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></g></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></g></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></g></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></g></symbol>
  <symbol id="i-thumb" viewBox="0 0 24 24"><path d="M7 11v9H4v-9zM7 11l4-7c1.6 0 2.6 1.1 2.3 2.6L12.8 9H19a2 2 0 0 1 2 2.4l-1.2 6.3A2 2 0 0 1 17.8 19H7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></symbol>
  <symbol id="i-cm" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4zM8 9h8M8 12h5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.8l2.8 5.8 6.4.9-4.6 4.5 1.1 6.3L12 17.3l-5.7 3 1.1-6.3-4.6-4.5 6.4-.9z"/></symbol>
  <symbol id="i-hex" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M12 2 21 6.6v10.8L12 22 3 17.4V6.6Z"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><path fill="currentColor" d="M12 12c2.2 0 4-1.8 4-4s-1.8-4-4-4-4 1.8-4 4 1.8 4 4 4zm0 2c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4z"/></symbol>
</svg>

<div class="app">

<!-- ===================== INICIO ===================== -->
<section class="view on" id="v-inicio">
  <header class="top">
    <button class="me" type="button"><span class="av"><svg class="i" style="font-size:1.4rem"><use href="#i-user"/></svg></span><span><b>@tu_alias</b><small>Obrero</small></span></button>
    <button class="ico" type="button" aria-label="Notificaciones"><svg class="i"><use href="#i-bell"/></svg></button>
  </header>

  <div class="caja">
    <small>CAJA DE CRÉDITOS</small>
    <div class="m"><b id="monto">$120.075,57</b><button type="button" id="ojo" aria-label="Ocultar créditos"><svg class="i"><use href="#i-eye"/></svg></button></div>
    <div class="acc"><span class="pill v">Obtener</span><span class="pill">Enviar</span></div>
  </div>

  <div class="sec-h"><h2 class="sec">Noticias</h2><button type="button" data-go="noticias">Ver todo<svg class="i"><use href="#i-chev"/></svg></button></div>
  <div class="stage" style="margin-top:6px;padding:8px 0 26px"><span class="blob3"></span><div id="newsHome"></div></div>

  <div class="sec-h" style="margin-top:20px"><h2 class="sec">Discusiones populares</h2><button type="button" data-go="descubrir">Ver todas<svg class="i"><use href="#i-chev"/></svg></button></div>
  <div class="row" id="discHome"></div>

  <div class="sec-h"><h2 class="sec">Reseñas recientes</h2><button type="button" data-go="descubrir" data-tab="rev">Ver todas<svg class="i"><use href="#i-chev"/></svg></button></div>
  <div class="stage"><span class="blob3"></span><div class="row" id="revHome" style="padding-top:0"></div></div>

  <div class="sec-h" style="margin-top:20px"><h2 class="sec">Sugerencias</h2></div>
  <div class="row">
    <div class="sg" style="background:#0d1209;color:var(--verde)">cube</div>
    <div class="sg" style="background:#FF1744;color:#fff">Festival Offscript</div>
    <div class="sg" style="background:var(--verde);color:#0a0a0a">Crear lista</div>
  </div>

  <div class="sec-h"><h2 class="sec">Tus listas</h2></div>
  <div class="row" id="listas"></div>
</section>

<!-- ===================== NOTICIAS ===================== -->
<section class="view" id="v-noticias">
  <header class="top"><span></span><button class="ico" type="button" aria-label="Notificaciones"><svg class="i"><use href="#i-bell"/></svg></button></header>
  <h1 class="page-t">Noticias</h1>
  <p class="page-s">Lo que pasa en el mundo de Cube, cuando pasa.</p>
  <div class="stage" style="margin-top:6px;padding-bottom:10px"><span class="blob3"></span><div id="newsFull"></div></div>
  <div class="nz-meta"><span>Más noticias llegarán pronto</span></div>
</section>

<!-- ===================== DESCUBRIR ===================== -->
<section class="view" id="v-descubrir">
  <header class="top"><span></span><button class="ico" type="button" aria-label="Notificaciones"><svg class="i"><use href="#i-bell"/></svg></button></header>
  <h1 class="page-t">Descubrir</h1>
  <div class="tabs"><button class="tab on" data-tab="disc" type="button">Discusiones</button><button class="tab" data-tab="rev" type="button">Reseñas</button></div>
  <div id="t-disc">
    <button class="crear" type="button" id="nuevaDisc"><svg class="i"><use href="#i-plus"/></svg>Crear discusión</button>
    <div class="list-v" id="discList"></div>
  </div>
  <div id="t-rev" hidden>
    <button class="crear" type="button" id="nuevaRev"><svg class="i"><use href="#i-plus"/></svg>Escribir reseña</button>
    <div class="stage" style="margin-top:18px"><span class="blob3"></span><div class="list-v" id="revList" style="padding-top:0"></div></div>
  </div>
</section>

<!-- ===================== BUSCAR ===================== -->
<section class="view" id="v-buscar">
  <div class="stage bs-stage" style="margin-top:0;padding-top:calc(env(safe-area-inset-top,0px) + 34px)"><span class="blob3"></span>
    <h1 class="page-t" style="padding-top:0;padding-bottom:18px">Buscar</h1>
    <label class="bs glass"><svg class="i"><use href="#i-search"/></svg><input id="q" type="search" placeholder="Título, género o palabra clave" autocomplete="off"></label>
    <div class="chips" id="chips"></div>
  </div>
  <div class="res" id="res"></div>
</section>

</div>

<!-- barra inferior -->
<nav class="nb" aria-label="Navegación">
  <div class="nb-seg">
    <button type="button" class="on" data-go="inicio"><svg class="i"><use href="#i-home"/></svg><span>Inicio</span></button>
    <button type="button" data-go="noticias"><svg class="i"><use href="#i-news"/></svg><span>Noticias</span></button>
    <button type="button" data-go="descubrir"><svg class="i"><use href="#i-comp"/></svg><span>Descubrir</span></button>
  </div>
  <button type="button" class="nb-s" data-go="buscar" aria-label="Buscar"><svg class="i"><use href="#i-search"/></svg></button>
</nav>

<div class="sh" id="sh"><div class="sh-c" id="shc"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=n=>`<svg class="i"><use href="#i-${n}"/></svg>`;
const HOY='15 de nov. de 2026';

/* ---------- datos de ejemplo (sin portadas todavía) ---------- */
const ST=[
 {id:'ratman',t:'Ratman',h:'#8A2BFF',g:'Terror'},{id:'backrooms',t:'Backrooms',h:'#FFEA00',g:'Misterio'},
 {id:'bigfoot',t:'Bigfoot 2',h:'#00E5A8',g:'Aventura'},{id:'divina',t:'Divina comedia',h:'#FF4D00',g:'Clásico'},
 {id:'telefono',t:'El teléfono',h:'#00CFFF',g:'Suspenso'},{id:'atraco',t:'Atraco',h:'#FF1744',g:'Acción'},
 {id:'apollo',t:'Apollo 18',h:'#B6FF00',g:'Ciencia ficción'}];
const st=id=>ST.find(x=>x.id===id)||ST[0];
const CLAROS=['#FFEA00','#B6FF00','#FFFFFF','#00E5A8','#DFFF00','#00CFFF'];
const tx=h=>CLAROS.includes(h.toUpperCase())?'#0a0a0a':'#fff';
const COL=['#8A2BFF','#FF4D00','#00CFFF','#FF00A8','#00E5A8','#FF7B00','#0066FF'];
const colAlias=a=>COL[[...a].reduce((s,c)=>s+c.charCodeAt(0),0)%COL.length];
const ini=a=>(a.replace('@','')[0]||'?').toUpperCase();

const DISC=[
 {s:'backrooms',q:'¿Alguien más notó que el pasillo cambia entre capítulos?',x:'Releí el capítulo dos y las luces ya no estaban donde las recordaba. Creo que la historia se reescribe sola cuando no la miras…',u:'@nocturna_ana',f:'12 de nov. de 2026',l:125,nc:26,me:false,c:[{u:'@lector_77',t:'Me pasó igual en el capítulo tres. Para mí es intencional.'},{u:'@mara.sk',t:'Yo apuesto a que hay una versión oculta del texto.'}]},
 {s:'ratman',q:'¿Ratman es héroe o es la plaga de la ciudad?',x:'Después de la última noticia ya no sé de qué lado estar. Todos lo ven distinto y nadie lo confirma.',u:'@paulo_r',f:'13 de nov. de 2026',l:89,nc:41,me:false,c:[{u:'@nocturna_ana',t:'Héroe, pero con un precio. Lee el final del capítulo cinco.'}]},
 {s:'apollo',q:'Teoría: la segunda grabación no es de la misma misión',x:'Las marcas de tiempo no cuadran con el diario del comandante. Alguien tuvo que editar el material antes de publicarlo.',u:'@agnes_g',f:'10 de nov. de 2026',l:64,nc:18,me:false,c:[]}];
const REV=[
 {s:'ratman',u:'@paulo_r',f:'31 de oct. de 2026',n:5,x:'Empieza en once, sube hasta un millón de millones y es de lo más perfecto que he leído en mucho tiempo. El final cambia todo lo anterior.',l:32},
 {s:'bigfoot',u:'@agnes_g',f:'8 de nov. de 2026',n:4,x:'Aventura con ritmo y personajes que se sienten reales. El segundo acto se alarga un poco, pero la despedida lo compensa.',l:18},
 {s:'telefono',u:'@lector_77',f:'11 de nov. de 2026',n:4,x:'Una llamada, una sola habitación y cero respiro. Me quedé sin uñas. Lo recomiendo de noche.',l:27}];
const LISTAS=[{n:'Horrores cósmicos largos',c:'#8A2BFF'},{n:'Pelis',c:'#FF4D00'},{n:'Para la noche',c:'#00CFFF'},{n:'Por leer',c:'#FFEA00'}];
const NEWS={
 hora:'hace 18 min',dl:'CIUDAD GÓTICA · 15 NOV 2026 · 02:14',
 t:'Ratman, visto en el metro a medianoche; la alcaldía lo niega',
 r:'Dos testigos aseguran haber visto a la figura trepar por el techo del vagón. Las cámaras de la estación llevan 11 horas sin funcionar.',
 tick:'ÚLTIMA HORA · Ratman, visto en el metro · La alcaldía lo niega · Dos testigos confirman · Cámaras fuera de servicio desde las 15:00 ·',
 cuerpo:['La línea 4 del metro de Ciudad Gótica fue evacuada anoche durante veinte minutos después de que varios pasajeros reportaran una silueta sobre el techo de uno de los vagones. Dos de ellos, que prefirieron no dar su nombre, describieron una figura “demasiado ágil para ser humana”.','La alcaldía negó los hechos en un comunicado breve y habló de “una falsa alarma amplificada por las redes”. Sin embargo, la empresa del metro confirmó que el sistema de cámaras de la estación Norte lleva once horas sin funcionar, algo que no ocurría desde hace años.','Es el tercer avistamiento de Ratman en la semana. Cube seguirá la cobertura y actualizará esta noticia en cuanto haya nuevos datos.'],
 op:['Publicar el testimonio de los dos testigos ahora','Esperar a que la alcaldía confirme los hechos']};

/* ---------- navegación ---------- */
function go(v,tab){
  $$('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));
  $$('.nb-seg button').forEach(b=>b.classList.toggle('on',b.dataset.go===v));
  $('.nb-s').classList.toggle('on',v==='buscar');
  $$('.nb-seg button span').forEach(s=>s.style.display=s.parentNode.classList.contains('on')?'inline':'none');
  window.scrollTo(0,0);
  if(tab) setTab(tab);
}
function setTab(t){
  $$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  $('#t-disc').hidden=t!=='disc'; $('#t-rev').hidden=t!=='rev';
}
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200)}
function sheet(h){$('#shc').innerHTML='<div class="grip"></div>'+h;$('#sh').classList.add('on')}
function closeSheet(){$('#sh').classList.remove('on')}
$('#sh').addEventListener('click',e=>{if(e.target.id==='sh')closeSheet()});

/* ---------- piezas ---------- */
const rx=()=>'<span class="rx"><i style="background:#0066FF">▲</i><i style="background:#FF1744">♥</i><i style="background:#FF7B00">★</i></span>';
function discCard(d,i){
  const s=st(d.s),a=d.u;
  return `<article class="dc" style="--h:${s.h}" data-i="${i}">
   <div class="dc-art"><span class="dc-tag">Discusión</span><b>${esc(s.t)}</b></div>
   <div class="dc-b"><h3>${esc(d.q)}</h3><p>${esc(d.x)}</p>
    <div class="dc-u"><span class="av" style="--c:${colAlias(a)}">${ini(a)}</span><div><b>${esc(a)}</b><small>${esc(s.t)} · ${esc(d.f)}</small></div></div></div>
   <div class="dc-f"><button type="button" data-a="like" class="${d.me?'on':''}">${ic('thumb')}${rx()}<span>${d.l}</span></button><button type="button" data-a="open">${ic('cm')}<span>${d.nc}</span></button><button type="button" data-a="open">Más ${ic('chev')}</button></div></article>`;
}
function stars(n){return '<div class="stars">'+[1,2,3,4,5].map(k=>`<span class="${k<=n?'f':''}">${ic('star')}</span>`).join('')+'</div>'}
function revCard(r){
  const s=st(r.s);
  return `<article class="rv glass"><div class="rv-h"><span class="av" style="--c:${colAlias(r.u)}">${ini(r.u)}</span><div><b>${esc(r.u)} reseñó</b><small>${esc(r.f)}</small></div></div>
   <div class="rv-st">${esc(s.t)}</div>${stars(r.n)}<p>${esc(r.x)}</p>
   <div class="rv-f"><div class="l">${ic('thumb')}${ic('cm')}</div><div class="r">${rx()}${r.l}</div></div></article>`;
}
function newsCard(){
  return `<div class="nz-stage"><div class="nz-wrap"><div class="nz-back b1"></div><div class="nz-back b2"></div>
   <button type="button" class="nz glass" data-a="news">
    <div class="nz-h"><span class="nz-logo">${ic('hex')}</span><div><b>Cube Noticias</b><small>Agencia Cube · Corresponsal</small></div><span class="t">${NEWS.hora}</span></div>
    <div class="nz-v"><span class="nz-live"><i></i>Última hora</span><div class="nz-dl">${NEWS.dl}</div><h3>${esc(NEWS.t)}</h3><p>${esc(NEWS.r)}</p></div>
    <div class="tick"><span>${esc(NEWS.tick)} ${esc(NEWS.tick)}</span></div>
    <div class="nz-f"><span>3 min de lectura</span><div class="r">${rx()}128<span class="leer">Leer</span></div></div>
   </button></div></div>`;
}
function renderAll(){
  $('#discHome').innerHTML=DISC.map((d,i)=>discCard(d,i)).join('');
  $('#discList').innerHTML=DISC.map((d,i)=>discCard(d,i)).join('');
  $('#revHome').innerHTML=REV.map(revCard).join('');
  $('#revList').innerHTML=REV.map(revCard).join('');
  $('#newsHome').innerHTML=newsCard(); $('#newsFull').innerHTML=newsCard();
  $('#listas').innerHTML=LISTAS.map(l=>`<button class="li" type="button" style="--c:${l.c};--tx:${tx(l.c)}"><span class="ring"><i>${ini(l.n)}</i></span><span>${esc(l.n)}</span></button>`).join('');
}

/* ---------- discusiones ---------- */
function openDisc(i){
  const d=DISC[i],s=st(d.s);
  sheet(`<h3>${esc(d.q)}</h3><p style="margin-top:10px;color:#c9ccc5;font-size:.92rem;line-height:1.6">${esc(d.x)}</p>
   <div class="dc-u" style="margin-bottom:0"><span class="av" style="--c:${colAlias(d.u)};width:38px;height:38px">${ini(d.u)}</span><div><b style="font:600 .85rem Poppins">${esc(d.u)}</b><br><small style="color:#8a8d87">${esc(s.t)} · ${esc(d.f)}</small></div></div>
   <div class="lbl">${d.nc} comentarios</div><div id="cms">${d.c.map(c=>`<div class="cm"><span class="av" style="--c:${colAlias(c.u)};width:34px;height:34px;font-size:.75rem">${ini(c.u)}</span><div><b>${esc(c.u)}</b><p>${esc(c.t)}</p></div></div>`).join('')||'<p class="vacio" style="padding:10px 0">Sé el primero en comentar.</p>'}</div>
   <div class="lbl">Tu comentario</div><textarea class="fld" id="cmT" placeholder="Escribe tu opinión…"></textarea>
   <button class="btn" type="button" id="cmGo">Comentar</button>`);
  $('#cmGo').onclick=()=>{const t=$('#cmT').value.trim();if(!t)return;d.c.push({u:'@tu_alias',t});d.nc++;renderAll();openDisc(i);toast('Comentario publicado')};
}
function newDisc(){
  let sel=ST[0].id;
  sheet(`<h3>Nueva discusión</h3><div class="lbl">¿De qué historia?</div>
   <div class="wrapc" id="ch">${ST.map(s=>`<button type="button" class="chip${s.id===sel?' on':''}" data-id="${s.id}">${esc(s.t)}</button>`).join('')}</div>
   <div class="lbl">Título de la discusión</div><input class="fld" id="dq" maxlength="90" placeholder="Ej. ¿Quién es el verdadero culpable?">
   <div class="lbl">Cuéntanos más</div><textarea class="fld" id="dx" placeholder="Tu teoría, duda o conexión entre historias…"></textarea>
   <button class="btn" type="button" id="dgo">Publicar discusión</button><button class="btn s" type="button" id="dno">Cancelar</button>`);
  $('#ch').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;sel=b.dataset.id;$$('#ch .chip').forEach(x=>x.classList.toggle('on',x===b))};
  $('#dno').onclick=closeSheet;
  $('#dgo').onclick=()=>{const q=$('#dq').value.trim(),x=$('#dx').value.trim();if(!q){$('#dq').focus();return}
    DISC.unshift({s:sel,q,x:x||'Sin descripción.',u:'@tu_alias',f:HOY,l:0,nc:0,me:false,c:[]});renderAll();closeSheet();toast('Discusión publicada')};
}
/* ---------- reseñas ---------- */
function newRev(){
  let sel=ST[0].id,n=5;
  const pick=()=>[1,2,3,4,5].map(k=>`<button type="button" class="${k<=n?'f':''}" data-k="${k}" style="font-size:2rem;color:${k<=n?'#C6FF00':'#3b3e39'}">${ic('star')}</button>`).join('');
  sheet(`<h3>Escribir reseña</h3><div class="lbl">Historia</div>
   <div class="wrapc" id="ch">${ST.map(s=>`<button type="button" class="chip${s.id===sel?' on':''}" data-id="${s.id}">${esc(s.t)}</button>`).join('')}</div>
   <div class="lbl">Tu puntuación</div><div class="pick" id="pk">${pick()}</div>
   <div class="lbl">Tu reseña</div><textarea class="fld" id="rx" maxlength="400" placeholder="¿Qué te pareció?"></textarea>
   <button class="btn" type="button" id="rgo">Publicar reseña</button><button class="btn s" type="button" id="rno">Cancelar</button>`);
  $('#ch').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;sel=b.dataset.id;$$('#ch .chip').forEach(x=>x.classList.toggle('on',x===b))};
  $('#pk').onclick=e=>{const b=e.target.closest('button');if(!b)return;n=+b.dataset.k;$('#pk').innerHTML=pick()};
  $('#rno').onclick=closeSheet;
  $('#rgo').onclick=()=>{const x=$('#rx').value.trim();if(!x){$('#rx').focus();return}
    REV.unshift({s:sel,u:'@tu_alias',f:HOY,n,x,l:0});renderAll();closeSheet();toast('Reseña publicada')};
}
/* ---------- noticia ---------- */
function openNews(){
  sheet(`<div class="art"><span class="nz-live" style="margin-top:2px"><i></i>Última hora</span>
   <div class="dl" style="margin-top:14px">${NEWS.dl}</div><h3 style="margin-top:8px;font-size:1.5rem;line-height:1.14">${esc(NEWS.t)}</h3>
   <div class="dl">POR AGENCIA CUBE · ${NEWS.hora.toUpperCase()}</div>
   ${NEWS.cuerpo.map(p=>`<p>${esc(p)}</p>`).join('')}
   <div class="lbl" style="margin-top:26px">Tú decides</div><p style="margin:0;font:600 .98rem/1.35 Poppins">¿Qué debería hacer el periódico?</p>
   <div id="ops">${NEWS.op.map((o,i)=>`<button class="opt" type="button" data-i="${i}">${esc(o)}</button>`).join('')}</div>
   <button class="btn" type="button" id="nd">Abrir discusión sobre esta noticia</button></div>`);
  $('#ops').onclick=e=>{const b=e.target.closest('.opt');if(!b)return;$$('#ops .opt').forEach(x=>x.classList.toggle('on',x===b));toast('Decisión registrada')};
  $('#nd').onclick=()=>{closeSheet();go('descubrir','disc');newDisc()};
}
/* ---------- buscador ---------- */
let genero='';
function buscar(){
  const q=$('#q').value.trim().toLowerCase();
  const r=ST.filter(s=>(!genero||s.g===genero)&&(!q||s.t.toLowerCase().includes(q)||s.g.toLowerCase().includes(q)));
  $('#res').innerHTML=r.length?r.map(s=>`<button class="rs" type="button" style="--c:${s.h};--tx:${tx(s.h)}"><span class="mono">${ini(s.t)}</span><span><b>${esc(s.t)}</b><small>${esc(s.g)}</small></span><span class="go">${ic('chev')}</span></button>`).join(''):'<p class="vacio">Sin resultados.</p>';
}
const GEN=[...new Set(ST.map(s=>s.g))];
$('#chips').innerHTML=GEN.map(g=>`<button class="chip" type="button" data-g="${g}">${g}</button>`).join('');
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;genero=genero===b.dataset.g?'':b.dataset.g;$$('#chips .chip').forEach(x=>x.classList.toggle('on',x.dataset.g===genero));buscar()};
$('#q').addEventListener('input',buscar);

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go,g.dataset.tab);return}
  const t=e.target.closest('.tab');if(t){setTab(t.dataset.tab);return}
  const a=e.target.closest('[data-a]');if(!a)return;
  const card=a.closest('.dc');
  if(a.dataset.a==='like'&&card){const d=DISC[+card.dataset.i];d.me=!d.me;d.l+=d.me?1:-1;renderAll()}
  else if(a.dataset.a==='open'&&card)openDisc(+card.dataset.i);
  else if(a.dataset.a==='news')openNews();
});
$('#nuevaDisc').onclick=newDisc;$('#nuevaRev').onclick=newRev;
let oculto=false;$('#ojo').onclick=()=>{oculto=!oculto;$('#monto').textContent=oculto?'$ ••••••':'$120.075,57'};
renderAll();buscar();go('inicio');
})();
</script>
</body>
</html>
